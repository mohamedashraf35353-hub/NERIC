<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a5cff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NERIC">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="config.js?v=202610290823"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NERIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0a5cff; --blue-d:#0047d1; --blue-l:#e8f0ff;
  --bg:#f3f6fb; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --green:#15803d; --green-l:#dcfce7; --amber:#b45309; --amber-l:#fef3c7;
  --red:#b91c1c; --red-l:#fee2e2; --gray-l:#f1f5f9; --purple:#6d28d9; --purple-l:#ede9fe;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --card:#121b2e; --text:#e5ecf6; --muted:#94a3b8; --line:#23304a;
    --blue-l:#13254a; --green-l:#0f2e1c; --amber-l:#33240b; --red-l:#3a1414; --gray-l:#1a2540; --purple-l:#251b45;
    --green:#4ade80; --amber:#fbbf24; --red:#f87171; --purple:#a78bfa;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --card:#121b2e; --text:#e5ecf6; --muted:#94a3b8; --line:#23304a;
  --blue-l:#13254a; --green-l:#0f2e1c; --amber-l:#33240b; --red-l:#3a1414; --gray-l:#1a2540; --purple-l:#251b45;
  --green:#4ade80; --amber:#fbbf24; --red:#f87171; --purple:#a78bfa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
.hidden{display:none !important}
a{color:var(--blue)}

/* ---------- Login ---------- */
/* ============ شاشة الدخول: كارت Neumorphism فوق مشهد ورشة قطارات مترو متحرك ============ */
#login{--nb:#e7ecf3;--nl:#ffffff;--nd:#c3cad6;--nt:#1e293b;--nm:#64748b;--na:#0a5cff;
  position:relative;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 16px;overflow:hidden;background:#050b18;isolation:isolate}
:root[data-theme="dark"] #login{--nb:#1a2233;--nl:#242f45;--nd:#0f1522;--nt:#e5ecf6;--nm:#94a3b8;--na:#60a5fa}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #login{--nb:#1a2233;--nl:#242f45;--nd:#0f1522;--nt:#e5ecf6;--nm:#94a3b8;--na:#60a5fa} }
/* المشهد: صورة قطار المترو (من تصميم كانفا) بحركة سينمائية */
.lg-scene{position:absolute;inset:0;z-index:-2;overflow:hidden;background:#030915}
.lg-photo{position:absolute;inset:-1.5%;background:var(--metro-img) 82% 45%/cover no-repeat;transform-origin:78% 46%;
  animation:lgKen 26s ease-in-out infinite alternate,lgPhotoIn 2.2s cubic-bezier(.2,.8,.2,1) backwards;will-change:transform}
@keyframes lgKen{0%{transform:scale(1) translate3d(0,0,0)}100%{transform:scale(1.07) translate3d(-1%,.5%,0)}}
@keyframes lgPhotoIn{from{opacity:0;filter:brightness(.3) blur(6px)}to{opacity:1;filter:none}}
.lg-hl{position:absolute;width:11vmin;height:11vmin;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(closest-side,rgba(220,236,255,.95),rgba(140,190,255,.35) 35%,transparent 70%);animation:lgHl 3.4s ease-in-out infinite}
.lg-hl.b{animation-delay:.25s}
@keyframes lgHl{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.85)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
.lg-beam{position:absolute;top:-20%;bottom:-20%;width:22%;left:-30%;background:linear-gradient(90deg,transparent,rgba(120,180,255,.10),rgba(200,230,255,.22),rgba(120,180,255,.10),transparent);
  transform:skewX(-22deg);mix-blend-mode:screen;animation:lgBeam 7.5s ease-in-out 1.5s infinite}
@keyframes lgBeam{0%{left:-30%}55%,100%{left:130%}}
.lg-rails{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(100deg,transparent 0 40%,rgba(140,200,255,.35) 48%,transparent 56%) 0 0/250% 100% no-repeat;
  -webkit-mask:linear-gradient(180deg,transparent 58%,#000 70%,#000 92%,transparent);mask:linear-gradient(180deg,transparent 58%,#000 70%,#000 92%,transparent);
  animation:lgRails 5.5s ease-in-out infinite}
@keyframes lgRails{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
.lg-dust{position:absolute;inset:0;pointer-events:none}
.lg-dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(190,220,255,.7);filter:blur(.6px);animation:lgDust var(--t,14s) linear var(--dl,0s) infinite;opacity:0}
@keyframes lgDust{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:.9}85%{opacity:.6}100%{transform:translate3d(var(--dx,40px),-140px,0);opacity:0}}
.lg-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(3,9,21,.42) 0%,rgba(3,9,21,.12) 42%,transparent 62%),linear-gradient(180deg,rgba(3,9,21,.25),transparent 20%,transparent 82%,rgba(3,9,21,.45))}
/* الكارت */
.lg-card{position:relative;width:100%;max-width:540px;padding:34px 30px 24px;border-radius:30px;color:var(--nt);
  background:color-mix(in srgb,var(--nb) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:18px 18px 40px rgba(0,0,0,.45),-6px -6px 22px rgba(255,255,255,.06),inset 1px 1px 0 rgba(255,255,255,.55);
  animation:lgCardIn .9s cubic-bezier(.2,.8,.2,1) .4s backwards}
:root[data-theme="dark"] .lg-card{box-shadow:18px 18px 40px rgba(0,0,0,.6),inset 1px 1px 0 rgba(255,255,255,.06)}
@keyframes lgCardIn{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
.neu-out{background:var(--nb);box-shadow:7px 7px 14px var(--nd),-7px -7px 14px var(--nl)}
.neu-in{background:var(--nb);box-shadow:inset 5px 5px 10px var(--nd),inset -5px -5px 10px var(--nl)}
.lg-lock{width:74px;height:74px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:var(--na)}
.lg-lock svg{width:30px;height:30px;fill:currentColor;animation:lgLockBob 3.2s ease-in-out infinite}
@keyframes lgLockBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.lg-team{margin:0;text-align:center;font-size:22px;font-weight:900;line-height:1.35;color:#38bdf8;
  background:linear-gradient(100deg,#38bdf8 0%,#38bdf8 38%,#e0f7ff 50%,#38bdf8 62%,#38bdf8 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 10px rgba(56,189,248,.35));animation:lgTeamIn .9s cubic-bezier(.2,.8,.2,1) .7s backwards,lgTeamShine 4.5s ease-in-out 1.6s infinite,lgTeamGlow 3s ease-in-out infinite}
@keyframes lgTeamIn{from{opacity:0;letter-spacing:.25em;transform:translateY(8px)}to{opacity:1;letter-spacing:normal;transform:none}}
@keyframes lgTeamShine{0%,55%{background-position:120% 0}100%{background-position:-20% 0}}
@keyframes lgTeamGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(56,189,248,.25))}50%{filter:drop-shadow(0 0 14px rgba(56,189,248,.55))}}
.lg-welcome{margin:8px 0 4px;text-align:center;font-size:28px;font-weight:900;color:var(--nt);letter-spacing:-.01em}
.lg-help{margin:0 0 22px;text-align:center;font-size:13.5px;color:var(--nm);line-height:1.6}
.fl{position:relative;margin-bottom:18px;border-radius:16px}
.fl input{width:100%;height:56px;border:0;border-radius:16px;padding:20px 18px 6px;font-size:16px;color:var(--nt);background:transparent;outline:none;font-family:inherit}
.fl input#lgEmail{direction:ltr;text-align:left}
.fl.pw input{padding-inline-start:50px}
.fl label{position:absolute;top:17px;inset-inline-end:18px;font-size:15px;color:var(--nm);pointer-events:none;transition:all .22s cubic-bezier(.2,.8,.2,1)}
.fl input:focus + label,.fl input:not(:placeholder-shown) + label{top:6px;font-size:11.5px;font-weight:700;color:var(--na)}
.fl-line{position:absolute;inset-inline:14px;bottom:5px;height:2px;border-radius:2px;overflow:hidden;opacity:0;transition:opacity .2s}
.fl-line::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#22d3ee,var(--na),transparent);background-size:45% 100%;background-repeat:no-repeat;animation:flRun 1.6s ease-in-out infinite}
.fl input:focus ~ .fl-line{opacity:1}
@keyframes flRun{0%{background-position:-60% 0}100%{background-position:160% 0}}
.fl-eye{position:absolute;top:50%;inset-inline-start:10px;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--nm);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fl-eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fl-eye .off{display:none}.fl-eye.on .on{display:none}.fl-eye.on .off{display:block}
.lg-opts{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 2px 18px;font-size:13px}
.lg-rem{display:inline-flex;align-items:center;gap:8px;color:var(--nm);cursor:pointer;-webkit-user-select:none;user-select:none}
.lg-rem input{position:absolute;opacity:0;pointer-events:none}
.lg-rem .bx{width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.lg-rem .bx::after{content:"";width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.lg-rem input:checked + .bx{background:linear-gradient(135deg,#22d3ee,var(--na));box-shadow:0 3px 10px -3px var(--na)}
.lg-rem input:checked + .bx::after{transform:rotate(-45deg) scale(1)}
.lg-rem input:focus-visible + .bx{outline:2px solid var(--na);outline-offset:2px}
.lg-link{border:0;background:none;color:var(--na);font:inherit;font-weight:700;cursor:pointer;padding:4px 0}
.btn-login{width:100%;height:54px;border:0;border-radius:16px;font-size:17px;font-weight:900;color:var(--na);cursor:pointer;font-family:inherit;position:relative;overflow:hidden;transition:color .25s,transform .12s,box-shadow .25s}
.btn-login::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,var(--na),#22d3ee);opacity:0;transition:opacity .3s}
.btn-login span{position:relative}
.btn-login:hover,.btn-login:focus-visible{color:#fff;outline:none;box-shadow:0 10px 24px -10px var(--na)}
.btn-login:hover::before,.btn-login:focus-visible::before{opacity:1}
.btn-login:active{transform:scale(.98)}
.btn-login:disabled{opacity:.7;cursor:default}
.btn-login.busy::before{opacity:1;background:linear-gradient(100deg,var(--na),#22d3ee,var(--na));background-size:200% 100%;animation:busySweep 1.2s linear infinite}
.btn-login.busy{color:#fff}
.login-err{background:color-mix(in srgb,#ef4444 14%,var(--nb));color:#dc2626;border-radius:12px;padding:10px 12px;margin-top:14px;font-weight:700;font-size:13.5px;line-height:1.6;text-align:center}
.login-err.info{background:color-mix(in srgb,var(--na) 12%,var(--nb));color:var(--na)}
:root[data-theme="dark"] .login-err{color:#fca5a5}
.lg-new{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px;font-size:13.5px;color:var(--nm)}
.lg-plus{width:40px;height:40px;border-radius:50%;border:0;color:var(--na);font-size:24px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s}
.lg-plus:active{box-shadow:inset 4px 4px 8px var(--nd),inset -4px -4px 8px var(--nl)}
.login-foot{margin-top:20px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--nm) 20%,transparent);text-align:center;font-size:12.5px;color:var(--nm);line-height:1.8}
.login-foot b{display:block;font-weight:800;color:var(--nt);font-size:12.5px}
.login-foot bdi{font-weight:800}
@media (max-width:480px){ .lg-card{padding:24px 18px 18px;border-radius:26px;background:color-mix(in srgb,var(--nb) 74%,transparent);-webkit-backdrop-filter:blur(7px) saturate(130%);backdrop-filter:blur(7px) saturate(130%)} .lg-lock{width:60px;height:60px;margin-bottom:10px} .lg-help{margin-bottom:18px} .lg-welcome{font-size:23px} .lg-team{font-size:19px}
  #login{align-items:flex-end;justify-content:center;padding:max(190px,26vh) 14px 18px} .lg-photo{inset:-2% -2% 30% -2%;background-position:88% 40%;transform-origin:85% 40%} .lg-shade{background:linear-gradient(180deg,transparent 0%,rgba(3,9,21,.2) 22%,rgba(3,9,21,.85) 40%,#030915 70%)} }
@media (prefers-reduced-motion:reduce){ .lg-photo,.lg-hl,.lg-beam,.lg-rails,.lg-dust i,.lg-lock svg,.fl-line::after,.lg-card,.lg-team{animation:none!important} }

/* ---------- Shell ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{display:flex;flex-direction:column;line-height:1.2;flex:1;min-width:0}
.brand b{font-size:22px;font-weight:900;letter-spacing:-.01em;width:fit-content;max-width:100%;
  background:linear-gradient(100deg,transparent 0 40%,rgba(255,255,255,.95) 50%,transparent 60% 100%) 120% 0/250% 100% no-repeat,var(--team-grad) 0 0/220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:lgTeamIn .9s cubic-bezier(.2,.8,.2,1) .2s backwards,hdTeamShine 4.5s ease-in-out 1.1s infinite,hdTeamGlow 3s ease-in-out infinite}
@keyframes hdTeamShine{0%,55%{background-position:120% 0,0 0}100%{background-position:-20% 0,100% 0}}
@keyframes hdTeamGlow{0%,100%{filter:drop-shadow(0 0 5px rgba(124,58,237,.22))}50%{filter:drop-shadow(0 0 13px rgba(192,38,211,.5))}}
@media (prefers-reduced-motion:reduce){ .brand b{animation:none} }
.brand span{color:var(--muted);font-size:14.5px;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:13px;color:var(--muted);text-align:left;line-height:1.3}
.who b{color:var(--text);display:block}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.layout{display:flex;min-height:calc(100vh - 60px)}
.side{width:230px;flex-shrink:0;background:var(--card);border-left:1px solid var(--line);padding:14px 10px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.side a,.drawer a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:var(--text);text-decoration:none;font-weight:600;cursor:pointer}
.side a:hover,.drawer a:hover{background:var(--gray-l)}
.side a.on,.drawer a.on{background:var(--blue-l);color:var(--blue)}
.side .ic,.drawer .ic{width:22px;text-align:center}
main{flex:1;min-width:0;padding:18px 16px 96px;max-width:1280px;margin-inline:auto}
/* القائمة الجانبية مخفية — بتظهر من زرار ☰ */
.side{display:none!important}
@keyframes drawerIn{from{transform:translateX(100%)}to{transform:none}}
.drawer{animation:drawerIn .26s cubic-bezier(.2,.7,.2,1) both}
.drawer-bg{animation:fadeIn .2s ease both}
@media (prefers-reduced-motion:reduce){.drawer,.drawer-bg{animation:none}}
.bottom{display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--muted);text-decoration:none;font-weight:700;padding:4px 0;cursor:pointer}
.bottom a .ic{font-size:21px;line-height:1.2}
.bottom a.on{color:var(--blue)}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.drawer{position:fixed;top:0;bottom:0;right:0;width:270px;max-width:85vw;background:var(--card);z-index:41;padding:16px 10px;overflow:auto}
@media (max-width: 860px){
  .brand b{font-size:17px;white-space:normal;line-height:1.25}
  .brand span{font-size:12.5px;margin-top:6px;white-space:normal}
  .st{flex:0 0 138px}
  .lineblock .stations.ltr{flex-direction:row;justify-content:flex-start}
  .d-desk{display:none}
  .linehead{flex-wrap:wrap}
  .side{display:none}
  .bottom{display:flex}
  .who{display:none}
  main{padding:14px 12px 96px}
}

/* ---------- UI ---------- */
h1.page{font-size:22px;margin:0 0 4px;font-weight:800}
.sub{color:var(--muted);margin:0 0 14px;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g3,.g2{grid-template-columns:1fr}}
.kpi .lbl{color:var(--muted);font-size:13px;font-weight:600}
.kpi .val{font-size:28px;font-weight:800;line-height:1.2;margin:2px 0}
.kpi .hint{font-size:12.5px;color:var(--muted)}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 10px}
.sec-title h2{font-size:17px;margin:0;font-weight:800}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 16px;border-radius:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--gray-l)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.danger{color:var(--red);border-color:var(--red-l)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.55;cursor:default}
/* =============== لوحة المتابعة — 3 أشكال (A / B / C) =============== */
.chip .cnt{font-weight:800}
.det{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.dhero{margin-bottom:14px}
.dhead{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dhead .sp{flex:1}
.stylepick{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.stylepick button{border:0;background:transparent;border-radius:9px;padding:5px 11px;font-weight:800;cursor:pointer;color:var(--text)}
.stylepick button.on{background:var(--blue);color:#fff}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.qt{position:relative;overflow:hidden;border:0;cursor:pointer;text-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:18px;min-height:118px;transition:transform .18s ease, box-shadow .18s ease}
.qt:hover{transform:translateY(-3px)}
.qt:active{transform:translateY(0) scale(.98)}
.qi{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qi svg,.ki svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qt-t{font-size:16px;font-weight:800;line-height:1.3;margin-top:auto}
.qt-s{font-size:12px;font-weight:600;opacity:.85;line-height:1.3}
.kpi{display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden}
.ki{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kb{min-width:0}

/* ---------- A: ليلي صناعي ---------- */

.ds-A .dhero .card{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.ds-A .dhero .card .sub{color:#9fb0d8}
.ds-A .kpi{--kc:#38bdf8;background:linear-gradient(160deg,#101d3f,#0a1430);border:1px solid #1e2f5c;color:#e8eefc}
.ds-A .kpi .lbl,.ds-A .kpi .hint{color:#94a6d1}
.ds-A .kpi .val{color:var(--kc);text-shadow:0 0 18px color-mix(in srgb,var(--kc) 45%,transparent)}
.ds-A .ki{color:var(--kc);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--kc) 55%,transparent)}
.ds-A .k1{--kc:#38bdf8}.ds-A .k2{--kc:#a78bfa}.ds-A .k3{--kc:#fb7185}.ds-A .k4{--kc:#fbbf24}

/* ---------- B: تدرجات زاهية ---------- */
.ds-B .qt{color:#fff;box-shadow:0 12px 26px -10px var(--qs)}
.ds-B .qt::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14);top:-60px;left:-50px}
.ds-B .qt::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.1);bottom:-40px;left:30px}
.ds-B .qt:hover{box-shadow:0 18px 34px -10px var(--qs)}
.ds-B .qi{background:rgba(255,255,255,.22);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.ds-B .qt > *{position:relative;z-index:1}
.ds-B .qt-a{background:linear-gradient(135deg,#2563eb 0%,#7c3aed 100%);--qs:rgba(79,70,229,.7)}
.ds-B .qt-p{background:linear-gradient(135deg,#059669 0%,#06b6d4 100%);--qs:rgba(5,150,105,.65)}
.ds-B .qt-s1{background:linear-gradient(135deg,#e11d48 0%,#f97316 100%);--qs:rgba(225,29,72,.6)}
.ds-B .qt-i{background:linear-gradient(135deg,#f59e0b 0%,#d946ef 100%);--qs:rgba(217,70,239,.55)}
.ds-B .kpi{--kg:linear-gradient(135deg,#2563eb,#7c3aed);--ks:#4f46e5;border:0;box-shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px -12px rgba(15,23,42,.25)}
.ds-B .kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--kg)}
.ds-B .ki{background:var(--kg);color:#fff;box-shadow:0 8px 18px -8px var(--ks)}
.ds-B .kpi .val{background:var(--kg);-webkit-background-clip:text;background-clip:text;color:transparent}
.ds-B .k1{--kg:linear-gradient(135deg,#2563eb,#7c3aed);--ks:#4f46e5}
.ds-B .k2{--kg:linear-gradient(135deg,#059669,#06b6d4);--ks:#059669}
.ds-B .k3{--kg:linear-gradient(135deg,#e11d48,#f97316);--ks:#e11d48}
.ds-B .k4{--kg:linear-gradient(135deg,#f59e0b,#d946ef);--ks:#d946ef}

/* ---------- C: زجاجي هادي ---------- */
body.ds-C{background:
  radial-gradient(600px 400px at 90% -5%,rgba(99,102,241,.18),transparent 60%),
  radial-gradient(500px 380px at 0% 20%,rgba(20,184,166,.15),transparent 60%),
  radial-gradient(520px 420px at 60% 100%,rgba(244,114,182,.12),transparent 60%),var(--bg);background-attachment:fixed}
.ds-C .card,.ds-C .qt{background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--card) 60%,var(--line))}
.ds-C .qt{color:var(--text);box-shadow:0 8px 30px -14px rgba(15,23,42,.25)}
.ds-C .qt:hover{box-shadow:0 0 0 2px var(--qc),0 14px 30px -14px var(--qc)}
.ds-C .qi{background:color-mix(in srgb,var(--qc) 14%,transparent);color:var(--qc)}
.ds-C .qt-t{color:var(--qc)}
.ds-C .qt-s{color:var(--muted);opacity:1}
.ds-C .qt-a{--qc:#4f46e5}.ds-C .qt-p{--qc:#0d9488}.ds-C .qt-s1{--qc:#e11d48}.ds-C .qt-i{--qc:#d97706}
.ds-C .kpi{--kc:#4f46e5;border-inline-start:5px solid var(--kc)}
.ds-C .ki{background:color-mix(in srgb,var(--kc) 13%,transparent);color:var(--kc);border-radius:50%}
.ds-C .kpi .val{color:var(--kc);font-size:32px}
.ds-C .k1{--kc:#4f46e5}.ds-C .k2{--kc:#0d9488}.ds-C .k3{--kc:#e11d48}.ds-C .k4{--kc:#d97706}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ds-C .qt-a{--qc:#818cf8}:root:not([data-theme="light"]) .ds-C .qt-p{--qc:#2dd4bf}:root:not([data-theme="light"]) .ds-C .qt-s1{--qc:#fb7185}:root:not([data-theme="light"]) .ds-C .qt-i{--qc:#fbbf24}}
:root[data-theme="dark"] .ds-C .qt-a{--qc:#818cf8}:root[data-theme="dark"] .ds-C .qt-p{--qc:#2dd4bf}:root[data-theme="dark"] .ds-C .qt-s1{--qc:#fb7185}:root[data-theme="dark"] .ds-C .qt-i{--qc:#fbbf24}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;background:var(--gray-l);color:var(--muted);white-space:nowrap}
.c-green{background:var(--green-l);color:var(--green)}.c-amber{background:var(--amber-l);color:var(--amber)}
.c-red{background:var(--red-l);color:var(--red)}.c-blue{background:var(--blue-l);color:var(--blue)}.c-purple{background:var(--purple-l);color:var(--purple)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.item:hover{border-color:var(--blue)}
.item .t{font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .m{color:var(--muted);font-size:13px;margin-top:4px;display:flex;gap:6px 14px;flex-wrap:wrap}
.item .acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters .f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);font-weight:600}
.filters input,.filters select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-width:120px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;border:1.5px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th{background:var(--gray-l);font-weight:800;font-size:13px;color:var(--muted);position:sticky;top:0}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:70vh}
.note{background:var(--blue-l);color:var(--text);border-radius:12px;padding:12px 14px;font-size:13.5px}
.note.warn{background:var(--amber-l)}
.bar{height:8px;background:var(--gray-l);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* ---------- Line board ---------- */
.lineblock{margin-bottom:16px}
.linehead{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:8px}
.linehead .dir{color:var(--muted);font-size:12.5px;font-weight:600}
.stations{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.stations.ltr{flex-direction:row-reverse;justify-content:flex-end}
.st{flex:1 0 128px;max-width:200px;scroll-snap-align:start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px;cursor:pointer;position:relative;min-height:122px;display:flex;flex-direction:column;gap:5px}
.st:hover{border-color:var(--blue)}
.st.busy{border-color:var(--blue);background:linear-gradient(0deg,var(--card),var(--blue-l))}
.st.buffer{background:repeating-linear-gradient(45deg,var(--card),var(--card) 8px,var(--gray-l) 8px,var(--gray-l) 16px)}
.st .code{font-weight:800;font-size:13px;color:var(--blue)}
.st .nm{font-size:12px;font-weight:700;line-height:1.3}
.st .ar{font-size:11.5px;color:var(--muted);line-height:1.3}
.st .cars{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.carchip{font-size:11.5px;font-weight:800;border-radius:7px;padding:1px 6px;background:var(--text);color:var(--card)}
.st .badges{position:absolute;top:7px;left:7px;display:flex;gap:3px}
.dot{font-size:11px;font-weight:800;border-radius:99px;padding:0 6px}
.nocar-msg{background:var(--red-l);color:var(--red);border:1.5px solid color-mix(in srgb,var(--red) 45%,transparent);border-radius:14px;padding:14px 16px;font-weight:800;font-size:16px;margin-bottom:12px;line-height:1.5}
.nocar-msg span{display:block;font-weight:600;font-size:13px;opacity:.9;margin-top:3px}
.nocar-msg.sm{font-size:14px;padding:10px 12px;margin:8px 0 0}
.d-mob{display:none}
@media (max-width:860px){.d-mob{display:inline}}
.stations.grid{display:grid;gap:8px;grid-auto-rows:auto}
.stations.grid .st{max-width:none;flex:none}
.stations.grid.hwgrid{row-gap:var(--hwgap,68px);padding-inline:16px;margin-inline:-16px;padding-top:6px}
.hwhead{align-self:end;padding-inline-end:8px}
.hwhead .linehead{margin-bottom:0}
.hwhead .page{margin-top:0}
.hwhead .sec-title{margin-top:4px}
/* ورشة الهارنيس */
.hwbox{align-self:end;display:flex;flex-direction:column;min-width:0}
.hwlabel{cursor:pointer;margin-bottom:28px;line-height:1.3}
.hwtag{display:block;font-size:13.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hwtitle{font-weight:900;font-size:22px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hwtitle .dir{color:var(--muted);font-size:15px;font-weight:700}
.hwframe{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 8px;isolation:isolate;padding:6px 0}
.hwframe::before{content:"";position:absolute;inset:-12px;z-index:-1;border-radius:18px;background:color-mix(in srgb,var(--gray-l) 55%,var(--card));
  border:1.5px solid color-mix(in srgb,var(--muted) 30%,var(--line));box-shadow:0 0 0 5px rgba(148,163,184,.22),0 0 20px 4px rgba(148,163,184,.32)}
.hwcell{position:relative;font:inherit;color:var(--text);text-align:center;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  margin-inline:7px;min-height:124px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .15s ease,border-color .2s}
.hwcell:hover{transform:translateY(-2px);border-color:var(--blue)}
.hwcell:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.hwcell .badges{position:absolute;top:10px;left:10px;display:flex;gap:7px;z-index:2;align-items:center}
@media (max-width:860px){ .hwcell .badges{top:6px;left:6px;gap:4px} .hwcell .sb{font-size:15px;padding:5px 9px 5px 7px} .hwcell .sb svg{width:16px;height:16px} }
.hwk{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--muted)}
.hwcar{font-size:28px;font-weight:900;letter-spacing:.04em;line-height:1.1;font-family:'Cairo',system-ui,sans-serif}
.hwst{display:block;font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.35;max-width:100%}
.hwprog{width:72%;height:5px;border-radius:99px;background:color-mix(in srgb,var(--muted) 22%,transparent);margin-top:5px;overflow:hidden}
.hwprog i{display:block;height:100%;border-radius:99px;background:currentColor}
.hwcell.duct{background-image:linear-gradient(180deg,transparent 0 calc(100% - 9px),color-mix(in srgb,var(--muted) 14%,transparent) calc(100% - 9px))}
.hwcell.tray{grid-column:span 2;min-height:132px;padding:0;overflow:visible}
.tray-half{position:absolute;inset-inline:10px;height:calc(50% - 14px);border-radius:8px;
  background:repeating-linear-gradient(90deg,transparent 0 18px,color-mix(in srgb,var(--muted) 18%,transparent) 18px 20px);
  border:1.5px solid color-mix(in srgb,var(--muted) 28%,transparent)}
.tray-half.t1{top:9px}.tray-half.t2{bottom:9px}
.tray-half.t2 i{top:auto;bottom:3px}
.tray-half i{position:absolute;top:3px;inset-inline-start:8px;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.14em;color:var(--muted)}
.tray-mid{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--card);border-radius:12px;padding:5px 14px;
  box-shadow:0 1px 0 var(--line),0 6px 16px -10px rgba(15,23,42,.35);max-width:calc(100% - 40px)}
.tray-mid .hwk{letter-spacing:.08em;font-size:12px}
/* الهالات: برتقالي = جاري — أخضر = اتسلّم — أحمر = توقف / مشكلة */
.s-orange{--hc:#ff7a00;--hcs:rgba(255,122,0,.9)}
.s-green{--hc:#00d14b;--hcs:rgba(0,209,75,.65)}
.s-yellow{--hc:#ffd400;--hcs:rgba(255,212,0,.75)}
/* الوضع المظلم: هالة أعرض وأقوى علشان تبان */

:root[data-theme="dark"] .s-green{--hc:#1aff6e;--hcs:rgba(26,255,110,.7)}
:root[data-theme="dark"] .s-red{--hc:#ff2d55;--hcs:rgba(255,45,85,1)}

:root[data-theme="dark"] .hwcell.s-red .hwst,:root[data-theme="dark"] .hwcell.s-red .hwcar{color:#ff5c7a}

/* تفاصيل الموضع */
.slotbanner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--gray-l)}
.slotbanner .hwcar{min-width:74px;text-align:center}
.slotbanner.s-orange,.slotbanner.s-yellow,.slotbanner.s-green,.slotbanner.s-red{border-color:var(--hc);box-shadow:0 0 0 2px var(--hc),0 0 18px 3px var(--hcs);background:color-mix(in srgb,var(--hc) 8%,var(--card))}
.slotlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:6px 0 12px}
.slotrow{font:inherit;color:var(--text);text-align:start;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.slotrow .hwcar{font-size:17px;min-width:44px;text-align:center}
.slotrow b{display:block;font-size:13px}
.slotrow.s-orange,.slotrow.s-yellow,.slotrow.s-green,.slotrow.s-red{border-color:var(--hc);box-shadow:0 0 0 1.5px var(--hc),0 0 10px 1px var(--hcs)}
.arrow{display:flex;align-items:center;color:var(--muted);font-size:20px;padding:0 2px}

/* ---------- Modal / Form ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}

/* ---------- Toast & loading ---------- */
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%;max-width:460px}
.toast{background:#0f172a;color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:auto;text-align:center}
.toast.err{background:#b91c1c}.toast.ok{background:#15803d}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);padding:40px 0}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.tabs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}

.grid-edit td{padding:5px 6px}
.grid-edit input[dir=ltr]{min-width:220px;text-align:left}
.myatt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.lineblock h1.lines-title{font-size:24px}
.lineblock .sec-title.lines-title h2{margin:0}
@media (min-width:861px){

  .hw-wide .tray-half{inset-inline:16px}

/* ---------- الحركة (Motion) ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes barMove{to{background-position:28px 0}}
@keyframes sheen{0%{transform:translateX(120%)}60%,100%{transform:translateX(-120%)}}
.mo{animation:rise .42s cubic-bezier(.2,.7,.2,1) backwards}
.hwcell.mo{animation:pop .5s cubic-bezier(.2,.7,.2,1) backwards}
.hwcell.mo.s-orange{animation:pop .5s cubic-bezier(.2,.7,.2,1) backwards,hwPulse 1.9s ease-in-out .5s infinite}
.hwcell.mo.s-red{animation:pop .5s cubic-bezier(.2,.7,.2,1) backwards,hwPulse 1.1s ease-in-out .5s infinite}
.modal-bg{animation:fadeIn .2s ease both}
.modal{animation:pop .28s cubic-bezier(.2,.7,.2,1) both}
.toast{animation:toastIn .26s cubic-bezier(.2,.7,.2,1) both}
.st{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.st:hover{transform:translateY(-3px);box-shadow:0 10px 22px -14px rgba(15,23,42,.45)}
.btn,.copy,.qt,.hwcell,.slotrow{transition:transform .12s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease}
.btn:active,.qt:active,.hwcell:active,.slotrow:active{transform:scale(.97)}
.hwcell.s-orange .hwprog i{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.38) 0 7px,transparent 7px 14px);background-size:28px 100%;animation:barMove .9s linear infinite}
.hwcell.s-green{overflow:hidden}
.hwcell.s-green::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(120%);animation:sheen 4.5s ease-in-out 1s infinite}
:root[data-theme="dark"] .hwcell.s-green::after{background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%)}
.hwcell.tray.s-green{overflow:hidden}
@media (prefers-reduced-motion:reduce){
  .mo,.hwcell.mo,.modal-bg,.modal,.toast{animation:none!important}
  .hwcell.s-orange .hwprog i,.hwcell.s-green::after{animation:none!important}
  .st,.btn,.qt,.hwcell,.slotrow{transition:none!important}
  .st:hover,.btn:active,.qt:active,.hwcell:active{transform:none}
}

/* ---------- المحطات: نفس مقاس ومحاذاة خانات الداكت ---------- */
/* الحساب: خانة الداكت = (العرض − 130) ÷ 4 — فالمحطات جنب بعض في صف واحد، 4 ظاهرين بنفس عرض الداكت والباقي بالسحب */
.lineblock .stations{display:grid;grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:calc((100% - 84px) / 4);column-gap:28px;
  padding:8px 23px 16px;scroll-padding-inline:23px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.lineblock .stations .st{scroll-snap-align:start}
.lineblock .stations.ltr{direction:ltr;justify-content:start}
.lineblock .stations.ltr > .st{direction:rtl}
.lineblock .linehead{padding-inline:14px;font-size:17px}
.lineblock .linehead .dir{font-size:14px}
.lineblock .stations .st{max-width:none;flex:none;min-height:170px;padding:14px 16px;border-radius:14px;gap:6px;border:1.5px solid color-mix(in srgb,var(--blue) 55%,var(--line));
  box-shadow:0 1px 0 var(--line),0 8px 20px -16px rgba(15,23,42,.35)}
.lineblock .stations .st .code{font-size:19px}
.lineblock .stations .st .nm{font-size:15px;line-height:1.35}
.lineblock .stations .st .ar{font-size:13.5px}
.lineblock .stations .st .carchip{font-size:13px;padding:2px 8px;border-radius:8px}
.lineblock .stations .st .badges{top:10px;left:10px}
@media (max-width:860px){
  /* الموبايل: محطتين في الصف — كل محطة بعرض خانتين داكت بالظبط */
  .lineblock .stations{grid-auto-columns:calc((100% - 14px) / 2);column-gap:14px;padding:8px 18px 14px;scroll-padding-inline:18px}
  .lineblock .stations.ltr{direction:rtl}
  .lineblock .stations .st{min-height:150px;padding:11px 12px}
  .lineblock .stations .st .code{font-size:16px}
  .lineblock .stations .st .nm{font-size:13.5px}
  .lineblock .stations .st .ar{font-size:12.5px}
  .lineblock .linehead{font-size:15.5px}
  .lineblock .linehead .dir{font-size:12.5px}
}
/* حركة المحطات */
@keyframes busySweep{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes boltBlink{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes chipIn{from{opacity:0;transform:translateX(-8px) scale(.9)}to{opacity:1;transform:none}}
.lineblock .stations .st:hover{transform:translateY(-4px);border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),0 16px 30px -18px color-mix(in srgb,var(--blue) 70%,transparent)}
.lineblock .stations .st.busy{overflow:hidden}
.lineblock .stations .st.busy{border-color:var(--blue)}
.lineblock .stations .st.busy::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;border-radius:12px 12px 0 0;
  background:linear-gradient(90deg,transparent,var(--blue),color-mix(in srgb,var(--blue) 40%,#7dd3fc),var(--blue),transparent);background-size:200% 100%;animation:busySweep 2.4s linear infinite}
.lineblock .stations .st.busy .ar[style*="--blue"]{animation:boltBlink 1.6s ease-in-out infinite}
.lineblock .stations .st .carchip{animation:chipIn .45s cubic-bezier(.2,.7,.2,1) .25s backwards}
@media (prefers-reduced-motion:reduce){
  .lineblock .stations .st.busy::before,.lineblock .stations .st .carchip,.lineblock .stations .st.busy .ar{animation:none!important}
  .lineblock .stations .st:hover{transform:none}
}

/* ---------- عربة المترو 3D جوه المحطات ---------- */
.lineblock .stations .st{min-height:220px}
.stage3d{position:relative;margin-top:auto;height:86px;perspective:520px;perspective-origin:50% 0%;transform-style:preserve-3d;
  transform:rotateY(var(--sy,0deg)) rotateX(var(--rx,0deg));transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.stage3d + .cars{margin-top:8px}
/* القضبان: أرضية بمنظور ثلاثي الأبعاد */
.track3d{position:absolute;inset-inline:-6px;bottom:0;height:64px;transform-origin:50% 100%;transform:rotateX(74deg);border-radius:6px;
  background:linear-gradient(180deg,transparent 0 14%,color-mix(in srgb,var(--muted) 16%,transparent) 14% 86%,transparent 86%);overflow:hidden}
.track3d .sl{position:absolute;inset:14% 0;background:repeating-linear-gradient(90deg,color-mix(in srgb,#8a6a4a 55%,var(--muted)) 0 7px,transparent 7px 17px);opacity:.75}
.track3d .rl{position:absolute;inset-inline:0;height:5px;background:linear-gradient(180deg,#e9eef5,#8c99ad 55%,#4b5568);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.track3d .rl.a{top:22%}.track3d .rl.b{bottom:22%}
.track3d .gl{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 40%,rgba(255,255,255,.75) 50%,transparent 60% 100%);background-size:260% 100%;mix-blend-mode:screen;opacity:0}
/* لمعة النور على القضبان — في كل المحطات، وبتعدي من تحت العربة لو فيه عربة */
.track3d .gl{opacity:1;animation:railGlint 6.6s ease-in-out infinite}
/* اللمعة بتجري في اتجاه حركة الخط: من اليمين للشمال — والخط اللي حركته من الشمال لليمين بالعكس */
@keyframes railGlint{0%{background-position:-130% 0}24%,100%{background-position:130% 0}}   /* لمعة سريعة (حوالي ثانية ونص) وبعدها 5 ثواني راحة */
.stations.ltr .track3d .gl{animation-direction:reverse!important}
/* العربة */
.car3d{position:absolute;inset-inline:4%;bottom:7px;transform-style:preserve-3d;transform:translateZ(14px) rotateY(var(--ry,0deg)) skewX(calc(var(--ry,0deg) * -.35));transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.car3d svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 6px 6px rgba(15,23,42,.28))}
.stations.ltr .car3d svg{transform:scaleX(-1)}
.car3d .shadow{position:absolute;inset-inline:6%;bottom:-6px;height:10px;border-radius:50%;background:radial-gradient(closest-side,rgba(15,23,42,.38),transparent);transform:translateZ(-14px)}
.car3d .bodyg{animation:sway 3.2s ease-in-out infinite;transform-origin:50% 100%;transform-box:view-box}
@keyframes sway{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-.7px) rotate(-.25deg)}}
.car3d .wh{transform-box:fill-box;transform-origin:center}
.car3d .hl{animation:hlPulse 2.4s ease-in-out infinite}
@keyframes hlPulse{0%,100%{opacity:.75}50%{opacity:1}}
.car3d.work .cabin{animation:cabin 1.4s ease-in-out infinite}
@keyframes cabin{0%,100%{opacity:.85}50%{opacity:1}}
.car3d .sheen{animation:carSheen 6.6s ease-in-out infinite;transform-box:view-box;transform-origin:0 0;transform:skewX(-18deg)}
/* اللمعة على الجسم بتعدي في اتجاه حركة الخط (من وش العربية لضهرها) — وفي الخط اللي حركته من الشمال لليمين الرسمة متقلوبة فبتتقلب معاها */
@keyframes carSheen{0%,76%{transform:skewX(-18deg) translateX(320px)}100%{transform:skewX(-18deg) translateX(0)}}   /* 5 ثواني راحة وبعدها لمعة */
/* دخول العربة: بتيجي من بعيد في العمق وتقف في المحطة */
.mo .car3d{animation:rollIn 1.1s cubic-bezier(.16,.84,.3,1) .1s backwards}
@keyframes rollIn{from{opacity:0;transform:translateZ(-120px) translateX(-70%) rotateY(28deg)}to{opacity:1;transform:translateZ(14px)}}
.stations.ltr .mo .car3d{animation-name:rollInL}
@keyframes rollInL{from{opacity:0;transform:translateZ(-120px) translateX(70%) rotateY(-28deg)}to{opacity:1;transform:translateZ(14px)}}
.mo .car3d .wh{animation:wSpin .5s linear 2}
@keyframes wSpin{to{transform:rotate(-360deg)}}
/* لما تسحب الخط: المسرح كله بيلف 3D مع السرعة، العجل بيلف، القضبان بتجري، وخطوط سرعة */
.driving .car3d{transition:transform .1s linear}
.driving .car3d .wh{animation:wSpin .28s linear infinite}
.driving .track3d .sl{animation:sleepRun .22s linear infinite}
@keyframes sleepRun{to{background-position:-17px 0}}
.stations.ltr.driving .track3d .sl{animation-direction:reverse}
.stage3d::after{content:"";position:absolute;inset:8px 0 18px;pointer-events:none;opacity:0;transition:opacity .25s;
  background:repeating-linear-gradient(180deg,transparent 0 7px,color-mix(in srgb,var(--blue) 55%,transparent) 7px 8px);
  -webkit-mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.driving .stage3d:has(.car3d)::after{opacity:.55;animation:streak .3s linear infinite}
@keyframes streak{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
/* لمسة الماوس: المحطة بتميل ناحية المؤشر */
.st.tilt .stage3d{transition:transform .15s ease-out}
.st.tilt .car3d{transform:translateZ(26px) rotateY(var(--ry,0deg))}
@media (max-width:860px){.stage3d{height:66px}.lineblock .stations .st{min-height:196px}}
@media (prefers-reduced-motion:reduce){
  .stage3d,.car3d{transition:none!important;transform:none!important}
  .car3d,.car3d *,.track3d *,.stage3d::after{animation:none!important}
  .car3d .sheen{display:none}
}

/* ---------- القوائم في الهيدر (جنب اسم الفريق) ---------- */
.brand{flex:0 1 auto}
.topnav{flex:1;min-width:0;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 4px;margin-inline-start:8px}
.topnav::-webkit-scrollbar{display:none}
.topnav a{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px;color:var(--text);text-decoration:none;cursor:pointer;transition:background-color .15s,color .15s}
.topnav a .ic{font-size:13px;opacity:.85}
.topnav a:hover{background:var(--gray-l)}

/* ---------- شارات التوقفات والمشكلات في المحطة: كبيرة وواضحة وبتنبض ---------- */
.lineblock .stations .st .badges{top:10px;left:10px;gap:7px;z-index:2;align-items:center}
.sb{--pc:rgba(225,29,72,.55);display:inline-flex;align-items:center;gap:5px;padding:6px 12px 6px 9px;border-radius:999px;font-weight:900;font-size:18px;line-height:1;color:#fff;position:relative;isolation:isolate;font-family:inherit}
.sb svg{width:19px;height:19px;flex:0 0 auto}
.sb b{font-weight:900;min-width:.6em;text-align:center}
.sb-stop{background:linear-gradient(135deg,#ff4d6d,#d90429);box-shadow:0 6px 16px -6px rgba(217,4,41,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.sb-stop svg{fill:#fff}
.sb-issue{--pc:rgba(245,158,11,.6);background:linear-gradient(135deg,#ffc233,#f08c00);color:#3b2300;box-shadow:0 6px 16px -6px rgba(240,140,0,.8),inset 0 1px 0 rgba(255,255,255,.45)}
.sb-issue svg path{fill:#3b2300;stroke:#3b2300;stroke-width:1.5}
.sb-issue svg .k{fill:#ffc233}
.sb::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;animation:sbPing 1.6s cubic-bezier(.2,.7,.2,1) infinite}
@keyframes sbPing{0%{box-shadow:0 0 0 0 var(--pc)}75%,100%{box-shadow:0 0 0 12px transparent}}
.sb-stop svg{animation:sbBlink 1.2s ease-in-out infinite}
@keyframes sbBlink{0%,100%{opacity:1}50%{opacity:.35}}
.sb-issue svg{transform-origin:50% 85%;animation:sbShake 2.4s ease-in-out infinite}
@keyframes sbShake{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-14deg)}80%{transform:rotate(12deg)}85%{transform:rotate(-8deg)}90%{transform:rotate(5deg)}}
.sb{animation:sbIn .5s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes sbIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
:root[data-theme="dark"] .sb-stop{box-shadow:0 0 18px -2px rgba(255,45,85,.75),inset 0 1px 0 rgba(255,255,255,.3)}
:root[data-theme="dark"] .sb-issue{box-shadow:0 0 18px -2px rgba(255,180,0,.7),inset 0 1px 0 rgba(255,255,255,.4)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .sb-stop{box-shadow:0 0 18px -2px rgba(255,45,85,.75),inset 0 1px 0 rgba(255,255,255,.3)}
  :root:not([data-theme="light"]) .sb-issue{box-shadow:0 0 18px -2px rgba(255,180,0,.7),inset 0 1px 0 rgba(255,255,255,.4)}
}
@media (max-width:860px){
  .lineblock .stations .st .badges{top:8px;left:8px;gap:6px}
  .sb{font-size:19px;padding:7px 12px 7px 9px}
  .sb svg{width:20px;height:20px}
}
@media (prefers-reduced-motion:reduce){.sb,.sb::before,.sb svg{animation:none!important}}

.bottom a{position:relative}
.bottom a .nb{position:absolute;top:0;inset-inline-start:calc(50% + 6px);margin:0}
.chatwrap{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 200px);min-height:460px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.clist{border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.clist-h{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}

.citem:hover{background:var(--gray-l)}
.citem.on{background:var(--blue-l)}
.cav{flex:0 0 42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;background:linear-gradient(135deg,#3b82f6,#6d28d9)}
.cav.all{background:linear-gradient(135deg,#0a5cff,#06b6d4);font-size:20px}
.cmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ctop,.cbot{display:flex;align-items:center;gap:8px}
.ctop b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.ctop time{font-size:11.5px;color:var(--muted)}
.cprev{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--muted)}
.citem.un .cprev{color:var(--text);font-weight:700}
.citem.un .ctop time{color:var(--blue);font-weight:800}
.cun{min-width:21px;height:21px;padding:0 6px;border-radius:99px;background:var(--blue);color:#fff;font-size:12px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
.cpane{display:flex;flex-direction:column;min-height:0;min-width:0;background:linear-gradient(180deg,color-mix(in srgb,var(--blue) 4%,var(--bg)),var(--bg))}
.cpane-h{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.cback{display:none}
.cmsgs{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:4px;min-height:0}
.cday{text-align:center;margin:10px 0 6px}
.cday span{font-size:12px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 12px}
.cb{align-self:flex-start;max-width:min(78%,560px);background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:7px 12px 5px;box-shadow:0 1px 1px rgba(15,23,42,.05);margin-top:6px;animation:rise .25s ease backwards}
.cb.cont{margin-top:1px}
.cb.me{align-self:flex-end;background:var(--blue);color:#fff;border-color:var(--blue);border-radius:16px 16px 4px 16px}
.cb.pending{opacity:.7}
.cwho{display:block;font-size:12px;font-weight:800;color:var(--blue);margin-bottom:1px}
.cwho i{font-style:normal;color:var(--muted);font-weight:600}
.ctx{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.55}
.cb.me .ctx a{color:#fff}
.cb time{display:block;font-size:10.5px;opacity:.7;text-align:end;margin-top:1px}
.cform{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line);background:var(--card)}
.cform textarea{flex:1;resize:none;max-height:140px;padding:11px 14px;border:1.5px solid var(--line);border-radius:22px;background:var(--gray-l);font-size:15px;line-height:1.4}
.cform textarea:focus{outline:none;border-color:var(--blue)}
.csend{width:46px;height:46px;border-radius:50%;padding:0;font-size:19px;flex:0 0 46px;transform:scaleX(-1)}
.cempty{margin:auto;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center;padding:30px;max-width:340px}
.cempty b{color:var(--text);font-size:17px}
.cempty.sm{margin:auto}
@media (max-width:860px){
  .chatwrap{grid-template-columns:1fr;min-height:380px;border-radius:14px}
  .chatwrap .cpane{display:none}
  .chatwrap.open .clist{display:none}
  .chatwrap.open .cpane{display:flex}
  .cback{display:inline-flex}
  .cb{max-width:86%}
}

/* ---------- الصور الشخصية + ملفات الدردشة ---------- */
.cav{--h:220;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 75% 55%),hsl(calc(var(--h) + 40) 70% 42%));overflow:hidden}
.cav.has{background:var(--gray-l)}
.cav img{width:100%;height:100%;object-fit:cover;display:block}
.cav.xs{flex:0 0 24px;width:24px;height:24px;font-size:12px;display:inline-flex}
.cav.sm{flex:0 0 34px;width:34px;height:34px;font-size:15px}
.cav.lg{flex:0 0 58px;width:58px;height:58px;font-size:24px}
.cav.xl{flex:0 0 132px;width:132px;height:132px;font-size:52px;margin:auto;box-shadow:0 8px 26px -10px rgba(15,23,42,.45)}
.whoav{border:0;background:transparent;padding:0;cursor:pointer;border-radius:50%;display:inline-flex}
.whoav:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.dme{display:flex;gap:12px;align-items:center;padding:6px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.dme-av{position:relative;border:0;background:transparent;padding:0;cursor:pointer;border-radius:50%}
.dme-av i{position:absolute;bottom:-2px;inset-inline-end:-4px;font-style:normal;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.avedit{padding:8px 0}
.btn .cav.xs{margin-inline-end:2px}
.cbav{align-self:flex-start;margin:8px 0 -2px}
.cb.g{margin-inline-start:30px}
.cbav + .cb.g{margin-top:-24px}
.cimgw{display:block;position:relative;margin:2px -6px 4px;border-radius:12px;overflow:hidden;cursor:zoom-in;min-width:160px;min-height:110px;background:color-mix(in srgb,var(--muted) 14%,transparent)}
.cimgw img{display:block;max-width:100%;max-height:320px;width:auto;margin:auto}
.cimgw.ld::after{content:"";position:absolute;inset:0;margin:auto;width:28px;height:28px;border:3px solid rgba(148,163,184,.4);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
.cimgw.err::after{content:"⚠ الصورة مش متاحة";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.cb.imgonly{padding:6px 6px 4px}
.cb.imgonly .cimgw{margin:0 0 2px}
.cfile{display:flex;gap:10px;align-items:center;text-align:start;font:inherit;color:inherit;background:color-mix(in srgb,var(--muted) 12%,transparent);border:1px solid color-mix(in srgb,var(--muted) 25%,transparent);border-radius:12px;padding:9px 12px;margin:2px 0 4px;cursor:pointer;min-width:200px;max-width:100%}
.cb.me .cfile{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3)}
.cfile.ld{opacity:.6}
.cfi{font-size:28px;line-height:1}
.cfn{display:flex;flex-direction:column;min-width:0}
.cfn b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfn span{font-size:11.5px;opacity:.75}
.catt{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);background:var(--card)}
.catt.hidden{display:none}
.catt img{width:52px;height:52px;object-fit:cover;border-radius:10px}
.cattn{flex:1;min-width:0;display:flex;flex-direction:column}
.cattn b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cattn span{font-size:12px;color:var(--muted)}
.cclip{width:44px;height:44px;border-radius:50%;flex:0 0 44px;font-size:19px}
.lbox{text-align:center}
.lbox img{max-width:100%;max-height:72vh;border-radius:10px}
@media (max-width:860px){ .whoav{display:none} }

/* ---------- صورتي في لوحة المتابعة والهيدر + الرسايل الصوتية ---------- */
.hello{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.helloav{border:0;background:transparent;padding:0;cursor:pointer;border-radius:50%;display:inline-flex;transition:transform .15s}
.helloav:hover{transform:scale(1.08)}
.cav.md{flex:0 0 40px;width:40px;height:40px;font-size:17px;box-shadow:0 0 0 2px var(--card),0 0 0 4px color-mix(in srgb,var(--blue) 45%,transparent)}
.whoav .cav.sm{flex:0 0 40px;width:40px;height:40px;box-shadow:0 0 0 2px var(--card),0 0 0 4px color-mix(in srgb,var(--blue) 40%,transparent)}
@media (max-width:860px){ .whoav{display:inline-flex} .whoav .cav.sm{width:34px;height:34px;flex-basis:34px} }
.cmic{width:44px;height:44px;border-radius:50%;flex:0 0 44px;font-size:19px}
.cform{position:relative}
.cform.rec > :not(.vbar){visibility:hidden}
.vbar{position:absolute;inset:6px 10px;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:22px}
.vdot{width:12px;height:12px;border-radius:50%;background:#e11d48;animation:sbBlink 1s ease-in-out infinite}
.vbar b{font-variant-numeric:tabular-nums;min-width:38px}
.vwave{display:inline-flex;gap:3px;align-items:center;height:22px;flex:1}
.vwave i{display:block;width:4px;border-radius:2px;background:var(--blue);animation:vw 1s ease-in-out infinite}
.vwave i:nth-child(2){animation-delay:.15s}.vwave i:nth-child(3){animation-delay:.3s}.vwave i:nth-child(4){animation-delay:.45s}.vwave i:nth-child(5){animation-delay:.6s}.vwave i:nth-child(6){animation-delay:.75s}.vwave i:nth-child(7){animation-delay:.9s}
@keyframes vw{0%,100%{height:5px}50%{height:22px}}
.caud{display:flex;align-items:center;gap:10px;min-width:220px;margin:2px 0 4px}
.caud audio{width:260px;max-width:100%;height:40px}
.caplay{width:40px;height:40px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:16px;cursor:pointer;flex:0 0 40px}
.cb.me .caplay{background:#fff;color:var(--blue)}
.cawave{flex:1;height:22px;background:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 6px);opacity:.35;-webkit-mask:linear-gradient(180deg,transparent 30%,#000 30% 70%,transparent 70%);mask:linear-gradient(180deg,transparent 30%,#000 30% 70%,transparent 70%)}
@media (prefers-reduced-motion:reduce){.vwave i,.vdot{animation:none}}

/* ---------- فقاعات الدردشة: زجاجي هادي بدل الأزرق الفاقع ---------- */
.cb.me{background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 16%,transparent),color-mix(in srgb,#06b6d4 10%,transparent));
  color:var(--text);border:1px solid color-mix(in srgb,var(--blue) 28%,transparent);
  -webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px -12px color-mix(in srgb,var(--blue) 60%,transparent)}
.cb.me time{color:var(--muted);opacity:1}
.cb.me .ctx a{color:var(--blue)}
.cb.me .cfile{background:color-mix(in srgb,var(--card) 55%,transparent);border-color:color-mix(in srgb,var(--blue) 22%,transparent)}
.cb.me .caplay{background:var(--blue);color:#fff}
.cb:not(.me){background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
:root[data-theme="dark"] .cb.me{background:linear-gradient(135deg,rgba(59,130,246,.24),rgba(6,182,212,.12));border-color:rgba(96,165,250,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 18px -12px rgba(59,130,246,.6)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .cb.me{background:linear-gradient(135deg,rgba(59,130,246,.24),rgba(6,182,212,.12));border-color:rgba(96,165,250,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 18px -12px rgba(59,130,246,.6)} }
/* شريط التسجيل وزرار الإرسال: زجاجي برضه */
.vbar{background:color-mix(in srgb,var(--blue) 8%,var(--card));border:1px solid color-mix(in srgb,var(--blue) 22%,transparent)}
.vwave i{background:color-mix(in srgb,var(--blue) 70%,#06b6d4)}
.csend{background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 82%,#fff),color-mix(in srgb,#06b6d4 75%,var(--blue)));border:0;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--blue) 80%,transparent)}
/* مسح الرسالة */
.cb{position:relative}
.cdel{position:absolute;top:-10px;inset-inline-end:-10px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer;opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s;box-shadow:var(--shadow);z-index:2}
.cb.del:hover .cdel,.cdel:focus-visible{opacity:1;transform:none}
@media (hover:none){ .cdel{display:none} }
.cb.del{-webkit-user-select:none;user-select:none}
.cb.del .ctx{-webkit-user-select:text;user-select:text}

/* ---------- زرار الإرسال/المايك زي واتساب ---------- */
.cact{position:relative;flex:0 0 48px;width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 82%,#fff),color-mix(in srgb,#06b6d4 75%,var(--blue)));
  box-shadow:0 6px 16px -8px color-mix(in srgb,var(--blue) 80%,transparent);display:inline-flex;align-items:center;justify-content:center;transition:transform .15s}
.cact:active{transform:scale(.92)}
.cact svg{width:23px;height:23px;fill:currentColor;stroke:currentColor;position:absolute;transition:transform .2s cubic-bezier(.34,1.56,.64,1),opacity .15s}
.cact .i-send{stroke:none;transform:scaleX(-1)}
.cact .i-mic rect{stroke:none}
.cact.mic .i-send{opacity:0;transform:scaleX(-1) scale(.4) rotate(-40deg)}
.cact:not(.mic) .i-mic{opacity:0;transform:scale(.4)}
.vbar{inset:4px 8px;padding-inline:4px}
.vtrash{width:40px;height:40px;border-radius:50%;border:0;background:transparent;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.vtrash svg{width:22px;height:22px;fill:currentColor}
.vtrash:hover{color:#e11d48;background:color-mix(in srgb,#e11d48 10%,transparent)}
.vwave{gap:2px;overflow:hidden}
.vwave i{width:3px;flex:0 0 3px}
.vwave i:nth-child(3n){animation-delay:.2s}.vwave i:nth-child(3n+1){animation-delay:.45s}.vwave i:nth-child(4n){animation-delay:.7s}
.citem.pin{position:sticky;top:0;z-index:1;background:color-mix(in srgb,var(--blue) 6%,var(--card))}
.citem.pin.on{background:var(--blue-l)}
.cpin{font-size:12px}
@media (max-width:860px){ .cgrp span{display:none} .cgrp{width:40px;height:40px;padding:0;border-radius:50%;font-size:17px} .cpane-h b{white-space:nowrap} }

/* ---------- لون اسم الفريق: كهرماني/برتقالي «كهربا» — غامق في المضيء وفاتح في المظلم ---------- */
:root{--team-grad:linear-gradient(90deg,#4f46e5 0%,#7c3aed 28%,#c026d3 55%,#e11d48 78%,#4f46e5 100%)}
:root[data-theme="dark"]{--team-grad:linear-gradient(90deg,#a5b4fc 0%,#c4b5fd 28%,#f0abfc 55%,#fda4af 78%,#a5b4fc 100%)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--team-grad:linear-gradient(90deg,#a5b4fc 0%,#c4b5fd 28%,#f0abfc 55%,#fda4af 78%,#a5b4fc 100%)} }
/* ---------- خلفية التطبيق: إضاءة ناعمة بتتحرك ببطء + شبكة نقط هندسية خفيفة ---------- */
#app{position:relative;isolation:isolate}
#app::before,#app::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
#app::before{background:
  radial-gradient(42vmax 42vmax at 12% 8%,color-mix(in srgb,var(--blue) 13%,transparent),transparent 62%),
  radial-gradient(38vmax 38vmax at 92% 22%,rgba(6,182,212,.12),transparent 60%),
  radial-gradient(46vmax 46vmax at 70% 100%,rgba(251,146,60,.10),transparent 62%),
  radial-gradient(34vmax 34vmax at 8% 92%,rgba(16,185,129,.08),transparent 60%);
  animation:appGlow 26s ease-in-out infinite alternate}
#app::after{background-image:radial-gradient(color-mix(in srgb,var(--muted) 28%,transparent) 1px,transparent 1.4px);background-size:22px 22px;
  -webkit-mask:linear-gradient(180deg,#000 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,.6) 100%);mask:linear-gradient(180deg,#000 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,.6) 100%);opacity:.55}
@keyframes appGlow{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-2%,1.5%,0) scale(1.06)}100%{transform:translate3d(2%,-1%,0) scale(1.03)}}
:root[data-theme="dark"] #app::before{opacity:.9}
:root[data-theme="dark"] #app::after{opacity:.35}
body.ds-C{background:var(--bg)!important}
.topbar{background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%)}
@media (prefers-reduced-motion:reduce){#app::before{animation:none}}


/* ---------- إشعارات الموبايل ---------- */
.cbell{white-space:nowrap}
.cbell.on{border-color:color-mix(in srgb,var(--green) 55%,var(--line));color:var(--green);background:color-mix(in srgb,var(--green) 9%,var(--card))}
.cbell .bellic{display:inline-block}
.cbell .bellic.ring{animation:bellRing 4s ease-in-out infinite;transform-origin:50% 10%}
@keyframes bellRing{0%,82%,100%{transform:rotate(0)}85%{transform:rotate(16deg)}88%{transform:rotate(-14deg)}91%{transform:rotate(10deg)}94%{transform:rotate(-6deg)}97%{transform:rotate(2deg)}}
@media (max-width:520px){ .clist-h .bell-t{display:none} }
.ptip{display:flex;align-items:center;gap:10px;margin:2px 0 4px;padding:10px 12px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--blue) 35%,var(--line));
  background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 10%,var(--card)),color-mix(in srgb,#06b6d4 8%,var(--card)));box-shadow:0 0 18px -8px color-mix(in srgb,var(--blue) 70%,transparent)}
.ptip.hidden{display:none}
.ptip-ic{font-size:22px;animation:bellRing 3s ease-in-out infinite;transform-origin:50% 10%}
.ptip-t{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.35}
.ptip-t b{font-size:13.5px}.ptip-t span{font-size:12px;color:var(--muted)}
.pstat{display:flex;gap:8px;align-items:center;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--muted) 10%,var(--card));border:1px solid var(--line);font-size:15px}
.pstat.ok{background:color-mix(in srgb,var(--green) 12%,var(--card));border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.pstat.bad{background:color-mix(in srgb,var(--red) 10%,var(--card));border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.psteps{margin:6px 0 0;padding-inline-start:22px;line-height:1.9;font-size:14px}

@media (min-width:861px){ #login{justify-content:flex-end;padding-inline:4vw 15vw} }
.lg-img{position:absolute;left:50%;top:50%;width:max(100%,177.7vh);height:max(100%,56.27vw);transform:translate(-50%,-50%);background:var(--metro-img) center/100% 100% no-repeat}
@media (min-width:861px){ .lg-img{left:auto;right:18%;top:57%;transform:translateY(-50%);-webkit-mask:linear-gradient(270deg,transparent 0,#000 9%),linear-gradient(180deg,transparent 0,#000 12%);-webkit-mask-composite:source-in;mask:linear-gradient(270deg,transparent 0,#000 9%),linear-gradient(180deg,transparent 0,#000 12%);mask-composite:intersect} }
@media (max-width:860px){ .lg-img{left:auto;right:-8%;top:0;transform:none;height:56vh;width:calc(56vh * 1.777)} }
/* خلفية التطبيق: نفس صورة القطر هادية جدًا ومتثبتة، وبتقرّب ببطء */
#app::before{background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 90%,transparent) 0%,color-mix(in srgb,var(--bg) 72%,transparent) 40%,color-mix(in srgb,var(--bg) 18%,transparent) 100%),var(--metro-img) right center/cover no-repeat;
  opacity:1;animation:appKen 40s ease-in-out infinite alternate;transform-origin:80% 45%}
:root:not([data-theme="dark"]) #app::before{filter:brightness(1.35) contrast(.95) saturate(1.05);opacity:.62}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #app::before{filter:none;opacity:1} }
/* أعلى الصفحة (اسم القائمة + اسم المستخدم) فاضي من غير صورة القطر — الصورة بتظهر بالتدريج تحتهم */
#app::before{-webkit-mask:linear-gradient(180deg,transparent 0,transparent 290px,#000 440px);mask:linear-gradient(180deg,transparent 0,transparent 290px,#000 440px)}
@keyframes appKen{from{transform:scale(1)}to{transform:scale(1.04)}}
@media (max-width:860px){ #app::before{background:linear-gradient(180deg,transparent 0,transparent 330px,color-mix(in srgb,var(--bg) 35%,transparent) 55%,var(--bg) 88%),var(--metro-img) 84% 300px/auto 50vh no-repeat;-webkit-mask:linear-gradient(180deg,transparent 0,transparent 300px,#000 380px);mask:linear-gradient(180deg,transparent 0,transparent 300px,#000 380px)} }
@media (prefers-reduced-motion:reduce){ #app::before{animation:none} }

/* ---------- أيقونات القوائم: أكبر وبحركة ---------- */
.ni{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:0 0 26px;font-size:19px;line-height:1;opacity:1!important}
.ni i{font-style:normal;display:inline-block;will-change:transform}
.topnav a .ic.ni{font-size:19px;opacity:1}
.side .ic.ni,.drawer .ic.ni{width:28px;font-size:21px}
.bottom a .ic.ni{width:30px;height:30px;font-size:23px}
.nchart{width:22px;height:22px;display:block}
.bottom .nchart{width:26px;height:26px}
.nchart .bg{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:.8}
.nchart rect[class^="b"]{transform-box:fill-box;transform-origin:50% 100%}
.nchart .b1{fill:#3b82f6;animation:ncBar 2.4s ease-in-out infinite}
.nchart .b2{fill:#ef4444;animation:ncBar 2.4s ease-in-out .4s infinite}
.nchart .b3{fill:#22c55e;animation:ncBar 2.4s ease-in-out .8s infinite}
.nchart .ln{fill:none;stroke:#0f172a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;animation:ncLine 3s ease-in-out infinite}
:root[data-theme="dark"] .nchart .bg{fill:#1e293b;stroke:#334155} :root[data-theme="dark"] .nchart .ln{stroke:#e2e8f0}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .nchart .bg{fill:#1e293b;stroke:#334155} :root:not([data-theme="light"]) .nchart .ln{stroke:#e2e8f0} }
@keyframes ncBar{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
@keyframes ncLine{0%{stroke-dashoffset:22}45%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:-22}}
/* 🚄 القطر بيقرّب من الكلمة كل شوية */
.ni-board i{animation:niTrain 3.2s cubic-bezier(.45,0,.2,1) infinite}
/* الإيموجي بيبص يمين، فبنقلبه علشان وشّه يبقى ناحية الكلمة (شمال في العربي) */
@keyframes niTrain{0%,55%,100%{transform:scaleX(-1) translateX(0)}70%{transform:scaleX(-1) translateX(8px)}78%{transform:scaleX(-1) translateX(5px)}86%{transform:scaleX(-1) translateX(6px)}}
/* ⚙️ الترس بيلف */
.ni-settings i{animation:niSpin 6s linear infinite}
@keyframes niSpin{to{transform:rotate(360deg)}}
/* ⏸️ نبض */
.ni-stop i{animation:niPulse 1.6s ease-in-out infinite}
@keyframes niPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.55}}
/* ⚠️ هزّة */
.ni-issue i{transform-origin:50% 85%;animation:sbShake 2.4s ease-in-out infinite}
/* ✅ نطّة */
.ni-att i{animation:niPop 2.6s cubic-bezier(.34,1.56,.64,1) infinite}
@keyframes niPop{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.28) rotate(-8deg)}90%{transform:scale(.94)}}
/* 💬 فقاعة بتتمايل */
.ni-chat i{transform-origin:20% 90%;animation:niChat 2.8s ease-in-out infinite}
@keyframes niChat{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-10deg) translateY(-2px)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
/* 📑 صفحة بتتقلب */
.ni-reports i{animation:niFlip 3.4s ease-in-out infinite}
@keyframes niFlip{0%,60%,100%{transform:perspective(60px) rotateY(0)}80%{transform:perspective(60px) rotateY(180deg)}}
/* ⚡ وميض كهربا */
.ni-prod i{animation:niZap 2.2s steps(1,end) infinite}
@keyframes niZap{0%,100%{filter:drop-shadow(0 0 0 rgba(250,204,21,0));transform:scale(1)}8%{filter:drop-shadow(0 0 6px rgba(250,204,21,.95));transform:scale(1.18)}12%{filter:none;transform:scale(1)}16%{filter:drop-shadow(0 0 8px rgba(250,204,21,1));transform:scale(1.12)}22%{filter:none;transform:scale(1)}}
.topnav a:hover .ni i,.side a:hover .ni i{animation-duration:.9s}
@media (prefers-reduced-motion:reduce){ .ni i,.nchart *{animation:none!important} }

/* ---------- الهيدر: الصورة والاسم أكبر وأوضح + زرار الخروج ---------- */
.whoav{margin-inline-end:12px}
.whoav .cav.sm{flex:0 0 50px;width:50px;height:50px;font-size:20px}
.who{font-size:14px;line-height:1.35;display:flex;flex-direction:column;align-items:flex-start;text-align:right}
.who b{font-size:16.5px;font-weight:800}
.tb-out{margin-top:8px;border:1px solid color-mix(in srgb,var(--red) 35%,var(--line));background:color-mix(in srgb,var(--red) 7%,var(--card));color:var(--red);
  font:inherit;font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:99px;cursor:pointer;transition:background-color .15s,box-shadow .15s}
.tb-out:hover{background:color-mix(in srgb,var(--red) 14%,var(--card));box-shadow:0 0 12px -4px color-mix(in srgb,var(--red) 70%,transparent)}
.tb-out:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (max-width:860px){ .who{display:none} .whoav{margin-inline-end:4px} .whoav .cav.sm{width:42px;height:42px;flex-basis:42px;font-size:17px} }
/* ---------- الصورة الشخصية: حلقة أخضر نيون بتنبض (ثانيتين نور وثانية هدوء) ---------- */
.whoav .cav.sm,.helloav .cav.md,.dme-av .cav.lg{animation:neonRing 3s ease-in-out infinite}
@keyframes neonRing{
  0%,100%{box-shadow:0 0 0 2px var(--card),0 0 0 4px rgba(57,255,20,.35),0 0 0 0 rgba(57,255,20,0)}
  6%,62%{box-shadow:0 0 0 2px var(--card),0 0 0 4px #39ff14,0 0 14px 4px rgba(57,255,20,.75),0 0 26px 8px rgba(57,255,20,.35)}
  70%{box-shadow:0 0 0 2px var(--card),0 0 0 4px rgba(57,255,20,.35),0 0 0 0 rgba(57,255,20,0)}}
@media (prefers-reduced-motion:reduce){ .whoav .cav.sm,.helloav .cav.md,.dme-av .cav.lg{animation:none} }

/* ✅ الحضور: علامة الصح بتترسم */
.ncheck{width:22px;height:22px;display:block}
.bottom .ncheck{width:26px;height:26px}
.ncheck .bx{fill:#22c55e}
.ncheck .ck{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:17;stroke-dashoffset:17;animation:ncDraw 2.8s ease-in-out infinite}
@keyframes ncDraw{0%,8%{stroke-dashoffset:17}38%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-17}}
.ni-att i{animation:niPopSoft 2.8s ease-in-out infinite}
@keyframes niPopSoft{0%,30%,100%{transform:scale(1)}38%{transform:scale(1.15)}46%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){ .ncheck .ck{animation:none;stroke-dashoffset:0} }
/* ---------- المظهر C + إضاءة النيون بتاعة A ---------- */
.ds-C .qt{position:relative;overflow:hidden}
.ds-C .qt::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--qc);box-shadow:0 0 16px var(--qc),0 0 4px var(--qc)}
.ds-C .qt:hover{box-shadow:0 0 0 1px var(--qc),0 10px 30px -8px var(--qc)}
.ds-C .qi{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--qc) 55%,transparent),0 0 18px -2px var(--qc)}
.ds-C .kpi .val{text-shadow:0 0 18px color-mix(in srgb,var(--kc) 45%,transparent)}
.ds-C .ki{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--kc) 55%,transparent),0 0 16px -4px var(--kc)}
.ds-C .kpi{box-shadow:0 8px 30px -14px rgba(15,23,42,.25),-6px 0 18px -10px var(--kc)}
</style>
