<script>
/* =============================================================
 *  مسار — الواجهة
 * =========================================================== */
var S = { token: null, boot: null, view: 'dashboard', params: {}, lastDash: null };
var TOKEN_KEY = 'masar_token_v1', THEME_KEY = 'masar_theme';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){ return null; } }

/* ---------- الاتصال بالسيرفر ---------- */
function call(action, payload){
  return new Promise(function(resolve, reject){
    var done = function(res){
      if (!res) return reject(new Error('رد فاضي من السيرفر. جرّب تاني.'));
      if (res.ok) return resolve(res.data);
      if (res.code === 'AUTH' && action !== 'login'){ forceLogout(res.error); }
      var e = new Error(res.error || 'حصل خطأ'); e.code = res.code; reject(e);
    };
    var fail = function(err){
      var m = (err && err.message) || String(err);
      if (/network|NetworkError|Failed to fetch|timed out/i.test(m)) m = 'مفيش اتصال بالإنترنت أو الاتصال ضعيف. اتأكد من النت وجرّب تاني — البيانات اللي اتحفظت قبل كده سليمة.';
      reject(new Error(m));
    };
    if (window.google && google.script && google.script.run){
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).api(S.token, action, payload || {});
    } else if (window.NERIC_API){
      // تطبيق الموبايل (PWA): نفس السيرفر عن طريق الرابط — text/plain علشان المتصفح مايعملش طلب CORS إضافي
      fetch(window.NERIC_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: S.token, action: action, p: payload || {} }), redirect: 'follow' })
        .then(function(r){ if (!r.ok) throw new Error('السيرفر رد بخطأ (' + r.status + '). جرّب تاني.'); return r.json(); })
        .then(done, fail);
    } else if (window.__mockApi){
      window.__mockApi(S.token, action, payload || {}).then(done, fail);
    } else fail(new Error('الصفحة دي لازم تتفتح من رابط تطبيق الويب.'));
  });
}

/* ---------- رسائل سريعة ---------- */
function toast(msg, type){
  var d = document.createElement('div');
  d.className = 'toast ' + (type || '');
  d.textContent = msg;
  $('toast').appendChild(d);
  setTimeout(function(){ d.remove(); }, type === 'err' ? 6000 : 3200);
}
function loadingHTML(t){ return '<div class="loading"><div class="spin"></div>' + esc(t || 'جاري التحميل...') + '</div>'; }

/* ---------- الثيم ---------- */
function applyTheme(t){ if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
applyTheme(store(THEME_KEY));
$('themeBtn').onclick = function(){
  var cur = document.documentElement.getAttribute('data-theme');
  var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  var nx = dark ? 'light' : 'dark'; store(THEME_KEY, nx); applyTheme(nx);
};

/* =============================================================
 *  الدخول
 * =========================================================== */
$('loginForm').onsubmit = function(ev){
  ev.preventDefault();
  var email = $('lgEmail').value.trim(), code = $('lgCode').value.trim();
  $('lgErr').classList.add('hidden');
  if (!email || !code){ showLoginErr('اكتب البريد ورمز الدخول.'); return; }
  $('lgBtn').disabled = true; $('lgBtn').classList.add('busy'); $('lgBtnT').textContent = 'جاري الدخول...';
  var rem = $('lgRem').checked;
  call('login', { email: email, code: code }).then(function(d){
    S.token = d.token;
    // «افتكرني»: الدخول بيفضل محفوظ والبريد بيتكتب لوحده المرة الجاية — من غيرها الدخول بيخلص لما التطبيق يتقفل
    if (rem){ store(TOKEN_KEY, d.token); store(EMAIL_KEY, email); try { sessionStorage.removeItem(TOKEN_KEY); } catch(e){} }
    else { store(TOKEN_KEY, null); store(EMAIL_KEY, null); try { sessionStorage.setItem(TOKEN_KEY, d.token); } catch(e){} }
    $('lgCode').value = '';
    return startApp();
  }).catch(function(e){ showLoginErr(e.message); })
    .then(function(){ $('lgBtn').disabled = false; $('lgBtn').classList.remove('busy'); $('lgBtnT').textContent = 'دخول'; });
};
function showLoginErr(m, info){ $('lgErr').textContent = m; $('lgErr').classList.toggle('info', !!info); $('lgErr').classList.remove('hidden'); }
var EMAIL_KEY = 'neric_email';
$('lgEye').onclick = function(){
  var i = $('lgCode'), show = i.type === 'password';
  i.type = show ? 'text' : 'password'; this.classList.toggle('on', show);
  this.setAttribute('aria-label', show ? 'إخفاء رمز الدخول' : 'إظهار رمز الدخول'); i.focus();
};
$('lgForgot').onclick = function(){ showLoginErr('رمز الدخول بيسجله رئيسك في العمل — كلّمه يديك رمز جديد.', true); };
$('lgNew').onclick = function(){ showLoginErr('حسابات الدخول بيعملها رئيسك في العمل — ابعتله بريدك الإلكتروني علشان يضيفك.', true); };
/** مشهد ورشة القطارات اللي ورا شاشة الدخول: 4 صفوف قطارات واقفة جنب بعض بمنظور، ونور السقف، وتراب في الهوا */
function buildLoginScene(){
  var el = $('lgScene'); if (!el || el.firstChild) return;
  // مكان الكشافين في الصورة (نسبة من عرض وطول الصورة) — بيتحسبوا مع الـ cover
  var h = '<div class="lg-photo" id="lgPhoto"><div class="lg-img"><span class="lg-hl" style="left:82.8%;top:46.9%"></span><span class="lg-hl b" style="left:74.6%;top:45.9%"></span><div class="lg-rails"></div></div></div><div class="lg-beam"></div><div class="lg-dust">';
  for (var j = 0; j < 30; j++) h += '<i style="left:' + Math.round(Math.random() * 100) + '%;top:' + Math.round(25 + Math.random() * 70) + '%;--t:' + (10 + Math.random() * 10).toFixed(1) + 's;--dl:' + (-Math.random() * 14).toFixed(1) + 's;--dx:' + Math.round(-60 + Math.random() * 120) + 'px"></i>';
  el.innerHTML = h + '</div>';
  // الماوس: الصورة بتتحرك حركة خفيفة عكس المؤشر (Parallax)
  if (!el._px){ el._px = 1; document.getElementById('login').addEventListener('pointermove', function(e){
    if (e.pointerType !== 'mouse') return; var p = $('lgPhoto'); if (!p) return;
    var x = (e.clientX / innerWidth - .5) * -14, y = (e.clientY / innerHeight - .5) * -10;
    p.style.translate = x.toFixed(1) + 'px ' + y.toFixed(1) + 'px';
  }); }
}

function forceLogout(msg){
  S.token = null; store(TOKEN_KEY, null); try { sessionStorage.removeItem(TOKEN_KEY); } catch(e){}
  buildLoginScene();
  if (typeof CHAT !== 'undefined'){ CHAT.with = null; CHAT.msgs = []; CHAT.convs = []; clearInterval(CHAT.timer); chatBadge(0); }
  closeModal();
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  if (msg) showLoginErr(msg);
}
document.addEventListener('click', function(e){ var b = e.target.closest && e.target.closest('#tbLogout'); if (b) logout(); });
function logout(){
  var t = S.token;
  forceLogout();
  // الأول نفك ربط الجهاز بالإشعارات (والجلسة لسه شغالة) — وبعدين نقفل الجلسة على السيرفر
  if (t) pushLogout(t).then(function(){ var keep = S.token; S.token = t; call('logout').catch(function(){}); S.token = keep; });
}

function startApp(){
  $('view').innerHTML = loadingHTML('جاري تجهيز البيانات...');
  return call('bootstrap').then(function(b){
    S.boot = b;
    applyDashStyle(b.myStyle || b.settings.DASH_STYLE);
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('tbTeam').textContent = b.settings.TEAM_NAME || 'NERIC';
    $('tbProject').textContent = 'NERIC - ' + (b.settings.PROJECT_NAME || '');
    $('tbName').textContent = b.me.name; $('tbRole').textContent = b.me.role;
    buildNav(); loadAvatars();
    var h = (location.hash || '').replace('#','');
    var qc = null; try { qc = new URLSearchParams(location.search).get('chat'); } catch(e){}
    if (qc !== null){   // جاي من دوسة على إشعار رسالة ← افتح المحادثة على طول
      try { history.replaceState(null, '', location.pathname + '#chat'); } catch(e){}
      CHAT.with = qc || null; go('chat');
    } else go(navItems().some(function(n){ return n.id === h; }) ? h : 'dashboard');
    setTimeout(pushResync, 2500);
  });
}

function refreshBoot(){ return call('bootstrap').then(function(b){ S.boot = b; loadAvatars(); }); }

/* =============================================================
 *  التنقل
 * =========================================================== */
function role(){ return S.boot ? S.boot.me.role : ''; }
function isMgr(){ return role() === 'مدير' || role() === 'مشرف'; }
function isOwner(){ return !!(S.boot && S.boot.isOwner); }
function isQM(){ return !!(S.boot && S.boot.isQM); }
function canHarness(){ return !!(S.boot && S.boot.canHarness); }
function hwCode(){ return (S.boot && S.boot.harness && S.boot.harness.code) || 'HW'; }
function hwLine(){ return (S.boot && S.boot.harness && S.boot.harness.line) || 'H'; }
function canMoveCars(){ return !!(S.boot && S.boot.canMoveCars); }
function canTray(){ return !!(S.boot && S.boot.canTray); }
function hwSlots(){ return (B().hwSlots || []); }
function slotDef(id){ return hwSlots().filter(function(x){ return x.id === id; })[0] || null; }
function slotLabel(id){ var d = slotDef(id); return d ? (d.kind === 'tray' ? d.label + ' — ' + d.car : d.label) : (id || ''); }
function slotOptions(){ return hwSlots().slice().reverse().map(function(d){ return { v: d.id, t: d.kind === 'tray' ? d.label + ' (لعربة ' + d.car + ')' : d.label }; }); }
function isHW(code){ return String(code || '').toUpperCase() === hwCode(); }
function isAdmin(){ return role() === 'مدير'; }
function canWrite(){ return role() && role() !== 'مشاهد'; }

/* أيقونة «لوحة المتابعة»: شارت أعمدة ومنحنى بيتحركوا طول الوقت */
var ICO_CHART = '<svg class="nchart" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="4.5" class="bg"/>' +
  '<rect x="5.2" y="9" width="3.4" height="10" rx="1" class="b1"/><rect x="10.3" y="6" width="3.4" height="13" rx="1" class="b2"/><rect x="15.4" y="11" width="3.4" height="8" rx="1" class="b3"/>' +
  '<path d="M4.5 13.5 9 9.5l4 2.5 6.5-6" class="ln"/></svg>';
/* أيقونة «الحضور»: مربع أخضر وعلامة صح بتترسم جواه كل شوية */
var ICO_CHECK = '<svg class="ncheck" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" class="bx"/><path d="M6.8 12.4l3.4 3.4 7-7.4" class="ck"/></svg>';
function navItems(){
  var r = role();
  var items = [
    { id:'dashboard', t:'لوحة المتابعة', ic: ICO_CHART, b:1 },
    { id:'board', t:'لوحة الخطوط', ic:'🚄', b:1 },
    { id:'prod', t:'الإنتاج', ic:'⚡', b:1 },
    { id:'stop', t:'التوقفات', ic:'⏸️' },
    { id:'issue', t:'المشكلات', ic:'⚠️' },
    { id:'att', t:'الحضور', ic: ICO_CHECK, b:1 },
    { id:'chat', t:'الدردشة', ic:'💬', b:1 }
  ];
  if (r !== 'مشاهد') items.push({ id:'reports', t:'التقارير', ic:'📑' });
  if (r === 'مدير') items.push({ id:'settings', t:'الإعدادات', ic:'⚙️' });
  return items;
}
function buildNav(){
  var items = navItems();
  function nb(n){ return n.id === 'chat' ? '<span class="nb hidden" data-chatbadge></span>' : ''; }
  function ic(n){ return n.ic ? '<span class="ic ni ni-' + n.id + '" aria-hidden="true"><i>' + n.ic + '</i></span>' : ''; }
  var side = items.map(function(n){ return '<a data-go="'+n.id+'">' + ic(n) + esc(n.t) + nb(n) + '</a>'; }).join('') +
    '<a data-act="logout" style="margin-top:14px;color:var(--red)"><span class="ic">⎋</span>تسجيل خروج</a>';
  $('side').innerHTML = side;
  $('topnav').innerHTML = items.map(function(n){ return '<a data-go="'+n.id+'">' + ic(n) + esc(n.t) + nb(n) + '</a>'; }).join('');
  $('drawer').innerHTML = '<div class="dme"><button type="button" class="dme-av" data-act="avatar" aria-label="تغيير صورتي">' + avatarHTML(S.boot.me.email, 'lg') + '<i>📷</i></button><div><b>'+esc(S.boot.me.name)+'</b><div class="sub" style="margin:0">'+esc(S.boot.me.role)+' — '+esc(S.boot.me.email)+'</div><button type="button" class="btn sm" data-act="avatar" style="margin-top:6px">📷 صورتي الشخصية</button></div></div>' + side;
  $('tbAv').innerHTML = avatarHTML(S.boot.me.email, 'sm');
  $('tbAv').onclick = function(){ openAvatarForm(); };
  $('bottom').innerHTML = items.filter(function(n){ return n.b; }).map(function(n){
    return '<a data-go="'+n.id+'">' + ic(n) + esc(n.short || n.t.replace('لوحة ',''))+nb(n)+'</a>';
  }).join('') + '<a data-act="menu"><span class="ic">☰</span>المزيد</a>';
  chatBadge(CHAT.unread);
  startChatPoll();
}
document.addEventListener('click', function(ev){
  var a = ev.target.closest('[data-go],[data-act]');
  if (!a) return;
  if (a.dataset.go){ go(a.dataset.go); closeDrawer(); }
  else if (a.dataset.act === 'logout'){ closeDrawer(); logout(); }
  else if (a.dataset.act === 'menu'){ openDrawer(); }
  else if (a.dataset.act === 'avatar'){ closeDrawer(); openAvatarForm(); }
});
$('menuBtn').onclick = function(){ openDrawer(); };
$('drawerBg').onclick = closeDrawer;
function openDrawer(){ $('drawerWrap').classList.remove('hidden'); }
function closeDrawer(){ $('drawerWrap').classList.add('hidden'); }
$('refreshBtn').onclick = function(){ refreshBoot().then(function(){ go(S.view, S.params); toast('تم التحديث'); }).catch(function(e){ toast(e.message,'err'); }); };

function go(view, params){
  S.view = view; S.params = params || {};
  try { history.replaceState(null, '', '#' + view); } catch(e){}
  document.querySelectorAll('[data-go]').forEach(function(a){ a.classList.toggle('on', a.dataset.go === view); });
  window.scrollTo(0,0);
  var fn = VIEWS[view] || VIEWS.dashboard;
  fn(S.params);
}

/* =============================================================
 *  أدوات عامة للعرض
 * =========================================================== */
var B = function(){ return S.boot; };
function stationLabel(code){
  var st = (B().stations || []).filter(function(s){ return s.code === code; })[0];
  return st ? (st.code + ' ' + (st.nameAr || st.name)) : (code || '');
}
function stName(code){ var st = (B().stations || []).filter(function(s){ return s.code === code; })[0]; return st ? (st.nameAr || st.name) : ''; }
function personName(email){ var p = (B().people || []).filter(function(x){ return x.email === email; })[0]; return p ? p.name + (p.code ? ' (' + p.code + ')' : '') : (email || ''); }
function codeOfName(n){ n = String(n || '').trim(); var p = (B().people || []).filter(function(x){ return x.name === n; })[0]; return p && p.code ? p.code : ''; }
/** «الاسم (الكود)» — ولو فيه أكتر من اسم بيعمل كده لكل واحد */
function withCodes(str, codes){
  var names = String(str || '').split(/[،,]/).map(function(x){ return x.trim(); }).filter(Boolean);
  var cs = String(codes || '').split(/[،,]/).map(function(x){ return x.trim(); });
  return names.map(function(n, i){ var c = (cs[i] && cs[i] !== '-') ? cs[i] : codeOfName(n); return n + (c ? ' (' + c + ')' : ''); }).join('، ');
}
function statusChip(s){
  var map = { 'جاري':'c-blue','مكتمل':'c-green','متوقف':'c-red','يحتاج مراجعة':'c-amber',
    'مفتوح':'c-red','جاري التعامل معه':'c-amber','بانتظار قطعة أو جهة أخرى':'c-purple','تم الحل':'c-green','مغلق':'',
    'جديدة':'c-red','تم الإسناد':'c-blue','قيد التنفيذ':'c-amber','بانتظار':'c-purple','محلولة':'c-green','مغلقة':'',
    'حاضر':'c-green','متأخر':'c-amber','غائب':'c-red','أجازة':'c-purple','مرضي':'c-blue','إذن / مأمورية':'c-purple','مأذونية':'c-purple','لم يسجل':'',
    'بانتظار الاعتماد':'c-amber','معتمد':'c-green','مرفوض':'c-red',
    'عاجلة':'c-red','عالية':'c-amber','متوسطة':'c-blue','منخفضة':'' };
  return s ? '<span class="chip '+(map[s]||'')+'">'+esc(s)+'</span>' : '';
}
function fmtMin(m){
  m = Math.round(Number(m) || 0);
  if (m < 60) return m + ' د';
  var h = Math.floor(m/60), r = m % 60;
  return h + ' س' + (r ? ' ' + r + ' د' : '');
}
function today(){ var d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate()); }
function p2(n){ return (n<10?'0':'') + n; }
function addDays(s, n){ var p = s.split('-'); var d = new Date(+p[0], +p[1]-1, +p[2]+n); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function nowTime(){ var d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function nowLocal(){ var d = new Date(); return today() + 'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function toInputDT(s){ return s ? String(s).replace(' ', 'T') : ''; }
function emptyHTML(title, txt, btn){ return '<div class="empty"><b>'+esc(title)+'</b>'+esc(txt||'')+(btn?'<div style="margin-top:12px">'+btn+'</div>':'')+'</div>'; }
/* ===== مُصدّر Excel صغير (xlsx) من غير أي مكتبة خارجية ===== */
var XLSX_MINI = (function(){
  var CRC = (function(){ var t = []; for (var n = 0; n < 256; n++){ var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b){ var c = 0xFFFFFFFF; for (var i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function utf8(s){ return new TextEncoder().encode(s); }
  function zip(files){ // [{name, data:Uint8Array}] — بدون ضغط (STORE)
    var parts = [], central = [], off = 0;
    function u16(v){ return [v & 255, (v >>> 8) & 255]; }
    function u32(v){ return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }
    files.forEach(function(f){
      var nm = utf8(f.name), d = f.data, c = crc32(d);
      var lh = [].concat([0x50,0x4b,0x03,0x04], u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(c), u32(d.length), u32(d.length), u16(nm.length), u16(0));
      parts.push(new Uint8Array(lh), nm, d);
      central.push(new Uint8Array([].concat([0x50,0x4b,0x01,0x02], u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(c), u32(d.length), u32(d.length), u16(nm.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(off))), nm);
      off += lh.length + nm.length + d.length;
    });
    var cs = 0; central.forEach(function(x){ cs += x.length; });
    var end = new Uint8Array([].concat([0x50,0x4b,0x05,0x06], u16(0), u16(0), u16(files.length), u16(files.length), u32(cs), u32(off), u16(0)));
    var all = parts.concat(central, [end]), len = 0; all.forEach(function(x){ len += x.length; });
    var out = new Uint8Array(len), p = 0; all.forEach(function(x){ out.set(x, p); p += x.length; });
    return out;
  }
  function x(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, ''); }
  function col(i){ var s = ''; i++; while (i > 0){ var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
  function isNum(v){ if (typeof v === 'number') return isFinite(v); var t = String(v == null ? '' : v).trim(); return /^-?\d+(\.\d+)?$/.test(t) && !(t.length > 1 && t[0] === '0' && t[1] !== '.'); }
  /** headers: [..], rows: [[..]] — بيرجع Uint8Array لملف xlsx منسق (RTL، فلتر، صف عناوين مثبت، جدول) */
  function build(sheetName, headers, rows){
    sheetName = String(sheetName || 'Sheet1').replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31) || 'Sheet1';
    var seen = {}; headers = headers.map(function(h){ h = String(h == null ? '' : h).trim() || 'عمود'; var b = h, i = 2; while (seen[h]) h = b + ' ' + (i++); seen[h] = 1; return h; });
    var n = headers.length, last = col(n - 1) + (rows.length + 1);
    var widths = headers.map(function(h){ return Math.max(10, h.length + 4); });
    var rx = ['<row r="1" ht="30" customHeight="1">' + headers.map(function(h, i){ return '<c r="' + col(i) + '1" t="inlineStr" s="1"><is><t>' + x(h) + '</t></is></c>'; }).join('') + '</row>'];
    rows.forEach(function(r, ri){
      var rn = ri + 2, z = ri % 2 ? 1 : 0;
      rx.push('<row r="' + rn + '">' + headers.map(function(_, i){
        var v = r[i], ref = col(i) + rn;
        if (v === null || v === undefined || v === '') return '<c r="' + ref + '" s="' + (2 + z) + '"/>';
        var t = String(v); widths[i] = Math.min(60, Math.max(widths[i], Math.min(t.length, 60) + 2));
        if (isNum(v)) return '<c r="' + ref + '" s="' + (4 + z) + '"><v>' + Number(v) + '</v></c>';
        return '<c r="' + ref + '" t="inlineStr" s="' + (2 + z) + '"><is><t xml:space="preserve">' + x(t) + '</t></is></c>';
      }).join('') + '</row>');
    });
    var sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheetViews><sheetView rightToLeft="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="18"/><cols>' + widths.map(function(w, i){ return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>'; }).join('') + '</cols>' +
      '<sheetData>' + rx.join('') + '</sheetData>' +
      (rows.length ? '' : '<autoFilter ref="A1:' + col(n - 1) + '1"/>') +
      '<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/>' +
      (rows.length ? '<tableParts count="1"><tablePart r:id="rId1"/></tableParts>' : '') + '</worksheet>';
    var table = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><table xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" id="1" name="Data" displayName="Data" ref="A1:' + last + '" totalsRowShown="0">' +
      '<autoFilter ref="A1:' + last + '"/><tableColumns count="' + n + '">' + headers.map(function(h, i){ return '<tableColumn id="' + (i + 1) + '" name="' + x(h) + '"/>'; }).join('') + '</tableColumns>' +
      '<tableStyleInfo name="TableStyleLight1" showFirstColumn="0" showLastColumn="0" showRowStripes="0" showColumnStripes="0"/></table>';
    var styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="2"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Arial"/></font></fonts>' +
      '<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FF1D4ED8"/><bgColor indexed="64"/></patternFill></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FFEEF3FF"/><bgColor indexed="64"/></patternFill></fill></fills>' +
      '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>' +
      '<border><left style="thin"><color rgb="FFCBD5E1"/></left><right style="thin"><color rgb="FFCBD5E1"/></right><top style="thin"><color rgb="FFCBD5E1"/></top><bottom style="thin"><color rgb="FFCBD5E1"/></bottom><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="6">' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1" readingOrder="2"/></xf>' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center" wrapText="1" readingOrder="2"/></xf>' +
      '<xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center" wrapText="1" readingOrder="2"/></xf>' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
      '<xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
      '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
    var files = [
      { name: '[Content_Types].xml', data: utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' + (rows.length ? '<Override PartName="/xl/tables/table1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.table+xml"/>' : '') + '</Types>') },
      { name: '_rels/.rels', data: utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>') },
      { name: 'xl/workbook.xml', data: utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets><sheet name="' + x(sheetName) + '" sheetId="1" r:id="rId1"/></sheets></workbook>') },
      { name: 'xl/_rels/workbook.xml.rels', data: utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>') },
      { name: 'xl/styles.xml', data: utf8(styles) },
      { name: 'xl/worksheets/sheet1.xml', data: utf8(sheet) }
    ];
    if (rows.length){
      files.push({ name: 'xl/worksheets/_rels/sheet1.xml.rels', data: utf8('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/table" Target="../tables/table1.xml"/></Relationships>') });
      files.push({ name: 'xl/tables/table1.xml', data: utf8(table) });
    }
    return zip(files);
  }
  return { build: build };
})();

/** تنزيل جدول Excel منسق (للمدير بس) */
function downloadCSV(name, headers, rows, fileBase){
  if (!isAdmin()){ toast('تنزيل البيانات للمدير بس.', 'err'); return; }
  name = String(name || 'بيانات').replace(/[\\/:*?"<>|]/g, '-');
  try {
    var data = XLSX_MINI.build(name.slice(0, 31), headers, rows);
    var blob = new Blob([data], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = String(fileBase || 'NERIC-data').replace(/[^A-Za-z0-9_.-]/g, '_') + '.xlsx';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
    toast('اتنزل ملف Excel (' + rows.length + ' صف)', 'ok');
    call('logEvent', { event: 'تنزيل Excel', sheet: name.slice(0, 60), details: rows.length + ' صف' }).catch(function(){});
  } catch (e) { toast('مقدرتش أعمل ملف Excel: ' + e.message, 'err'); }
}

function stationOptions(onlyElectrical, forWrite){
  return (B().stations || []).filter(function(s){ return (!onlyElectrical || s.electrical !== 'لا') && (!forWrite || !isHW(s.code) || canHarness()); })
    .map(function(s){ return { v: s.code, t: s.code + ' — ' + (s.nameAr || s.name) + (s.line === hwLine() ? ' (الجودة)' : ' (خط ' + s.line + ')') }; });
}
function peopleOptions(filter){ return (B().people || []).filter(filter || function(){ return true; }).map(function(p){ return { v: p.name, t: p.name + (p.code ? ' (' + p.code + ')' : '') }; }); }
function techOptionsByEmail(){ var qm = !isOwner() && isQM(); return (B().people || []).filter(function(p){ return qm ? (p.isQ || p.email === B().me.email) : (p.role === 'فني' || p.role === 'مشرف'); }).map(function(p){ return { v: p.email, t: p.name + (p.code ? ' (' + p.code + ')' : '') + (p.team ? ' — ' + p.team : '') }; }); }
/* ---------- اسم العربة: C16 - MCI - U4 (رقم العربة شمال، النوع في النص، الوحدة يمين) ---------- */
function normCarNo(v){ v = String(v == null ? '' : v).replace(/\s+/g, '').toUpperCase().replace(/[٠-٩]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }); return /^\d+$/.test(v) ? 'C' + v : v; }
function normUnit(v){ v = String(v == null ? '' : v).replace(/\s+/g, '').toUpperCase().replace(/[٠-٩]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }); return /^\d+$/.test(v) ? 'U' + v : v; }
function carNameOf(c){ if (!c) return ''; return [normCarNo(c.car), c.carType, normUnit(c.unit)].filter(Boolean).join(' - '); }
function carFull(c){ if (!c || !c.car) return ''; return c.carName || carNameOf(c); }
/** اسم العربة بيتعرض دايمًا من الشمال لليمين علشان الترتيب مايتقلبش جوه الكلام العربي */
function carTag(c){ var n = carFull(c); return n ? '<bdi dir="ltr" class="carname">' + esc(n) + '</bdi>' : ''; }
function carByNo(no){ no = normCarNo(no); return (B().cars || []).filter(function(x){ return normCarNo(x.car) === no; })[0]; }
function onLineCars(){ return (B().cars || []).filter(function(c){ return c.car && c.status !== 'خرجت من الخط'; }).sort(function(a,b){ return String(a.station).localeCompare(String(b.station), 'en', { numeric: true }); }); }
function carOptions(){ return onLineCars().map(function(c){ return { v: normCarNo(c.car), t: '\u2066' + carFull(c) + '\u2069' + (c.station ? '  ·  ' + stationLabel(c.station) : '') }; }); }

function opts(arr){ return (arr || []).map(function(x){ return { v: x, t: x }; }); }

/* ---------- المودال ---------- */
function openModal(title, body, footer){
  $('modalRoot').innerHTML = '<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true">' +
    '<div class="modal-h"><h3>'+esc(title)+'</h3><button class="icon-btn" id="mclose" aria-label="إغلاق">✕</button></div>' +
    '<div class="modal-b" id="mbody">'+body+'</div>' + (footer ? '<div class="modal-f" id="mfoot">'+footer+'</div>' : '') + '</div></div>';
  $('mclose').onclick = closeModal;
  $('mbg').addEventListener('mousedown', function(e){ if (e.target.id === 'mbg') closeModal(); });
}
function closeModal(){ $('modalRoot').innerHTML = ''; }

function fieldHTML(f, val, ro){
  var id = 'f_' + f.k, req = f.req ? ' <span class="req">*</span>' : '';
  var dis = ro ? ' disabled' : '';
  var h = '<div class="fld' + (f.full ? ' full' : '') + '"><label for="'+id+'">'+esc(f.t)+req+'</label>';
  if (f.type === 'hidden') return '<input type="hidden" id="'+id+'" value="'+esc(val)+'">';
  if (f.type === 'carpick'){
    // العربة بتتختار من القائمة بس — العربيات اللي على الخط (المسؤول هو اللي بيضيفها ويحركها)
    var list = onLineCars(), cur = normCarNo(val), inList = list.some(function(c){ return normCarNo(c.car) === cur; });
    var old = cur && !inList ? (FORM_REC.carName || carNameOf({ car: cur, carType: FORM_REC.carType, unit: FORM_REC.unit })) : '';
    h += '<select id="'+id+'"'+dis+'><option value="">— اختار العربة —</option>' +
      (old ? '<option value="'+esc(cur)+'" selected>\u2066'+esc(old)+'\u2069  ·  خرجت من الخط</option>' : '') +
      list.map(function(c){ var v = normCarNo(c.car); return '<option value="'+esc(v)+'"'+(v === cur ? ' selected' : '')+'>\u2066'+esc(carFull(c))+'\u2069'+(c.station ? '  —  محطة \u2066'+esc(c.station)+'\u2069' : '')+'</option>'; }).join('') +
      '</select>' + (list.length ? '' : '<div class="hint">مفيش عربات على الخط لسه — ' + (canMoveCars() ? 'ضيفها من لوحة الخطوط ← «نقل / إضافة عربة».' : 'المسؤول هو اللي بيضيف العربيات.') + '</div>');
    return h + '</div>';
  }
  if (f.type === 'select'){
    var options = f.options || [];
    var has = options.some(function(o){ return o.v === val; });
    h += '<select id="'+id+'"'+dis+'><option value="">— اختار —</option>' +
      (val && !has ? '<option value="'+esc(val)+'" selected>'+esc(val)+'</option>' : '') +
      options.map(function(o){ return '<option value="'+esc(o.v)+'"'+(o.v === val ? ' selected' : '')+'>'+esc(o.t)+'</option>'; }).join('') + '</select>';
  } else if (f.type === 'textarea'){
    h += '<textarea id="'+id+'"'+dis+'>'+esc(val)+'</textarea>';
  } else if (f.type === 'multi'){
    var sel = String(val || '').split(/[،,]/).map(function(x){ return x.trim(); }).filter(Boolean);
    var options2 = (f.options || []).slice();
    sel.forEach(function(s){ if (!options2.some(function(o){ return o.v === s; })) options2.push({ v: s, t: s }); });
    h += '<div class="multi" id="'+id+'">' + (options2.length ? options2.map(function(o){
      var on = sel.indexOf(o.v) >= 0;
      return '<label class="'+(on?'on':'')+'"><input type="checkbox" value="'+esc(o.v)+'"'+(on?' checked':'')+dis+'>'+esc(o.t)+'</label>';
    }).join('') : '<span class="hint">مفيش فنيين مسجلين في صلاحيات الدخول.</span>') + '</div>';
  } else {
    var type = f.type || 'text';
    var v = type === 'datetime-local' ? toInputDT(val) : val;
    if (type === 'time' && /^\d:\d{2}$/.test(String(v || ''))) v = '0' + v;   // 8:30 ← 08:30 علشان الخانة ماتفضاش
    h += '<input id="'+id+'" type="'+type+'"' + (type === 'number' ? ' inputmode="decimal" min="0" step="any"' : '') +
      (f.list ? ' list="'+f.list+'"' : '') + ' value="'+esc(v)+'"'+dis+'>';
  }
  if (f.hint) h += '<div class="hint">'+esc(f.hint)+'</div>';

}
function readField(f){
  var el = $('f_' + f.k); if (!el) return '';

    return Array.prototype.map.call(el.querySelectorAll('input:checked'), function(i){ return i.value; }).join('، ');
  }
  var v = el.value;
  if (f.type === 'datetime-local') v = v ? v.replace('T', ' ') : '';
  return v;
}
function datalists(){

function canEditRec(entity, r){
  if (!canWrite()) return false;
  if (!r || !r.id) return true;
  if (entity === 'att') return canManageAtt(r);
  if (isMgr()) return true;
  if (r.createdBy !== B().me.email) return false;
  if (entity === 'prod' && r.status === 'مكتمل') return false;
  if (entity === 'stop' && (r.status === 'تم الحل' || r.status === 'مغلق')) return false;
  if (entity === 'issue' && (r.status === 'محلولة' || r.status === 'مغلقة')) return false;
  return true;
}

var FORM_OPTS = {};
/** متابعة شغل من يوم فات: صف جديد بنفس رقم المهمة، والسجل القديم مايتغيرش */
function continueWork(base){
  var r = {};
  ['shift','station','slot','car','carType','train','unit','step','techs','supervisor'].forEach(function(k){ r[k] = base[k] || ''; });
  if (B().me.role === 'فني' && r.techs.split(/[،,]/).map(function(x){ return x.trim(); }).indexOf(B().me.name) < 0) r.techs = B().me.name;
  r.date = today(); r.status = 'جاري'; r.startTime = nowTime(); r.endTime = ''; r.notes = '';
  openForm('prod', r, null, { continueFrom: base.id, base: base });
}
function isPastProd(r){ return r && r.id && r.date && r.date < today(); }

    else if (ro) body += '<div class="note" style="margin-top:8px">السجل ده للعرض بس — مش مسموح لك تعدله.' + (canContinue ? ' لو الشغل لسه ماخلصش دوس «متابعة الشغل».' : '') + '</div>';
  }

      ' — هيتسجل في <b>صف جديد</b> بتاريخ النهارده، والسجل القديم مش هيتغير.</div>' + body;
  }
  var contBtn = canContinue ? '<button class="btn primary" id="fcont">' + (past ? 'متابعة الشغل النهارده' : 'متابعة الشغل') + '</button>' : '';

    (isAdmin() ? '<span class="sp"></span><button class="btn danger" id="fdel">حذف</button>' : '');
  else foot = '<button class="btn primary" id="fsave">'+(isNew ? 'حفظ' : 'حفظ التعديل')+'</button>' + contBtn + '<button class="btn" id="fcancel">إلغاء</button>' +
    (!isNew && isAdmin() ? '<span class="sp"></span><button class="btn danger" id="fdel">حذف</button>' : '');
  var title = FORM_OPTS.continueFrom ? 'متابعة شغل' : ((isNew ? 'إضافة ' : (ro ? 'عرض ' : (past ? 'سجل يوم فات — ' : 'تعديل '))) + F.title);
  openModal(title, body, foot);
  $('fcancel').onclick = closeModal;
  if ($('fcont')) $('fcont').onclick = function(){ continueWork(rec); };

  Array.prototype.forEach.call(document.querySelectorAll('.multi input'), function(i){
    i.onchange = function(){ i.parentNode.classList.toggle('on', i.checked); };

  if (entity === 'prod' || entity === 'stop' || entity === 'issue') { wireSlotField(entity); if (!ro && isNew) wireStationCar(); }

  $('fsave').onclick = function(){ submitForm(entity, F, rec, onSaved, false); };

  if ($('fdel')) $('fdel').onclick = function(){

    $('fdel').disabled = true;
    call('remove', { entity: entity, id: rec.id }).then(function(){
      closeModal(); toast('تم الحذف', 'ok'); go(S.view, S.params);
    }).catch(function(e){ $('fdel').disabled = false; formMsg(e.message, 'err'); });

function formMsg(m, t){ $('fmsg').innerHTML = m ? '<div class="form-msg '+(t||'err')+'">'+esc(m)+'</div>' : ''; if (m) $('mbody').scrollTop = 0; }

function submitForm(entity, F, rec, onSaved, confirmed){
  var data = { id: rec.id || '' };
  if (entity === 'prod'){
    if (FORM_OPTS.continueFrom) data.continueFrom = FORM_OPTS.continueFrom;
    if (FORM_OPTS.correct) data.correct = true;
  }
  var missing = [];
  F.fields.forEach(function(f){ data[f.k] = readField(f); if (f.req && !String(data[f.k]).trim()) missing.push(f.t); });
  if (missing.length){ formMsg('لازم تكمل: ' + missing.join('، ')); return; }
  if ('slot' in data){
    if (isHW(data.station)){
      data.car = ''; if ('train' in data) data.train = ''; if ('unit' in data) data.unit = '';
      if (entity === 'prod' && !data.slot){ formMsg('اختار موضع الشغل في الورشة (ضبعة داكت أو ترابيزة تراي).'); return; }
    } else data.slot = '';
  }
  if (entity === 'stop' && (data.status === 'تم الحل' || data.status === 'مغلق')){
    if (!data.end){ formMsg('علشان تقفل التوقف اكتب وقت النهاية.'); return; }
    if (!String(data.action).trim()){ formMsg('علشان تقفل التوقف اكتب الإجراء اللي اتعمل.'); return; }
  }
  if (entity === 'issue' && (data.status === 'محلولة' || data.status === 'مغلقة') && !String(data.action).trim()){
    formMsg('علشان تقفل المشكلة اكتب الإجراء أو الحل.'); return;
  }
  $('fsave').disabled = true; $('fsave').textContent = 'جاري الحفظ...';
  call('save', { entity: entity, record: data }).then(function(res){
    closeModal();
    toast((res.mode === 'متابعة' ? 'اتسجل في صف جديد كمتابعة للمهمة' : 'تم الحفظ') + (res.warnings && res.warnings.length ? ' — ' + res.warnings.join(' ') : ''), 'ok');
    var after = function(){ if (onSaved) onSaved(res.record); else go(S.view, S.params); };
    if (entity === 'prod' && data.car) refreshBoot().then(after, after); else after();
  }).catch(function(e){
    $('fsave').disabled = false; $('fsave').textContent = FORM_OPTS.correct ? 'تصحيح السجل ده' : (rec.id ? 'حفظ التعديل' : 'حفظ');
    formMsg(e.message, e.code === 'CONFLICT' ? 'warn' : 'err');
  });
}

function wireProdForm(){
  var car = $('f_car'), st = $('f_station'), ct = $('f_carType');
  function fillSteps(){
    var list = $('stepsList'); if (!list) return;
    var code = st ? st.value : '', type = ct ? ct.value : '';
    var steps = (B().steps || []).filter(function(s){
      if (code && s.station && s.station !== code) return false;
      if (type && s.carTypes && s.carTypes !== 'الكل' && s.carTypes.split(/[،,\s]+/).indexOf(type) < 0) return false;
      return true;
    }).sort(function(a,b){ return (+a.order||0) - (+b.order||0); });
    list.innerHTML = steps.map(function(s){ return '<option value="'+esc(s.name)+'">'+esc((s.code ? s.code + ' — ' : '') + (s.station || ''))+'</option>'; }).join('');
  }
  if (car) car.addEventListener('change', function(){
    var c = carByNo(car.value);
    if (ct) ct.value = c ? (c.carType || '') : '';
    if ($('f_unit')) $('f_unit').value = c ? normUnit(c.unit || '') : '';
    if ($('f_train')) $('f_train').value = c ? (c.train || '') : '';
    if (c && st && !st.value && c.station){ st.value = c.station; st.dispatchEvent(new Event('change')); }
    fillSteps();
  });
  if (st) st.addEventListener('change', fillSteps);
  if (ct) ct.addEventListener('change', fillSteps);
  fillSteps();
}
/** خانة «موضع الورشة» بتظهر بس لما المحطة تكون ورشة الهارنيس — وخانات العربة بتختفي هناك (مفيش عربات في الورشة) */
function wireSlotField(entity){
  var st = $('f_station'), sl = $('f_slot'); if (!sl) return;
  function wrap(id){ var e = $(id); return e ? e.closest('.cb, .fld') : null; }
  function apply(){
    var hw = st ? isHW(st.value) : false;
    var w = wrap('f_slot'); if (w) w.style.display = hw ? '' : 'none';
    ['f_car'].forEach(function(id){ var x = wrap(id); if (x) x.style.display = hw ? 'none' : ''; });
  }
  sl.addEventListener('change', function(){
    var d = slotDef(sl.value), ct = $('f_carType');
    if (d && ct){ ct.value = d.car; ct.dispatchEvent(new Event('change')); }
  });
  if (st) st.addEventListener('change', apply);
  apply();
}
/** التسجيل الجديد على محطة في الخطوط: العربة بتتحط لوحدها من العربة الواقفة في المحطة — ولو مفيش عربة الحفظ بيتقفل */
function stationCar(code){ return (B().cars || []).filter(function(c){ return c.station === code && c.status !== 'خرجت من الخط'; })[0] || null; }
function wireStationCar(){
  var st = $('f_station'), car = $('f_car'); if (!st || !car) return;
  var box = document.createElement('div'); box.id = 'nocarMsg'; st.closest('.fld').appendChild(box);
  function apply(){
    var code = st.value, hw = isHW(code), c = code && !hw ? stationCar(code) : null, block = !!(code && !hw && !c);
    if (code && !hw){
      var v = c ? normCarNo(c.car) : '';
      if (car.value !== v){ car.value = v; car.dispatchEvent(new Event('change')); }
      car.disabled = true;
    } else car.disabled = false;
    box.innerHTML = block ? '<div class="nocar-msg sm" role="alert">🚫 مفيش عربة في المحطة الحالية — من فضلك راجع المسؤول.</div>' : '';
    var sv = $('fsave'); if (sv){ sv.disabled = block; sv.title = block ? 'مفيش عربة في المحطة' : ''; }

}

function boardHTML(board, compact, topHTML, midHTML){
  midHTML = midHTML || '';
  if (!board || !board.length) return (topHTML || '') + emptyHTML('مفيش محطات', 'ضيف المحطات من «إعدادات المصنع ← المحطات».');
  var ltr = String(B().settings.LINE_DIR_LTR || '').split(/[،,\s]+/);
  var lines = {}, hw = [];
  board.forEach(function(s){ if (s.line === hwLine()) hw.push(s); else (lines[s.line] = lines[s.line] || []).push(s); });
  var keys = Object.keys(lines).sort();
  var hwPlaced = false, topPlaced = false;
  var out = keys.map(function(ln, idx){
    var isLtr = ltr.indexOf(String(ln)) >= 0;
    var sts = lines[ln].sort(function(a,b){ return a.order - b.order; });
    var lineHead = '<div class="linehead">الخط ' + esc(ln) + ' <span class="dir">' + (isLtr ? '<span class="d-desk">الحركة من الشمال لليمين</span><span class="d-mob">المحطات بترتيب الحركة</span>' : 'الحركة من اليمين للشمال') +
      (idx < keys.length - 1 ? ' — بعد آخر محطة تنتقل للخط ' + esc(keys[idx+1]) : ' — وبعد آخر محطة تنتقل العربة لورشة الاختبار Test Shop') + '</span></div>';
    var i1 = -1, i4 = -1;
    sts.forEach(function(s, i){ if (s.code === '#1') i1 = i; if (s.code === '#4') i4 = i; });
    if (hw.length && !hwPlaced && i1 >= 0){
      // ورشة الهارنيس فوق الخطوط بعرض الصفحة كلها (نفس الشكل على الكمبيوتر والموبايل)
      hwPlaced = true; topPlaced = true;
      return '<div class="lineblock">' + (topHTML || '') + '<div class="hw-mob hw-wide">' + hw.map(function(h){ return hwBlock(h, 1, 1); }).join('') + '</div>' + midHTML + lineHead +
        '<div class="stations' + (isLtr ? ' ltr' : '') + '">' + sts.map(function(s){ return stationTile(s, compact); }).join('') + '</div></div>';
    }
    return '<div class="lineblock">' + lineHead + '<div class="stations' + (isLtr ? ' ltr' : '') + '">' + sts.map(function(s){ return stationTile(s, compact); }).join('') + '</div></div>';
  });
  if (hw.length && !hwPlaced) out.unshift('<div class="lineblock"><div class="hw-mob">' + hw.map(function(h){ return hwBlock(h, 1, 1); }).join('') + '</div></div>');
  return (topPlaced ? '' : (topHTML || '') + midHTML) + out.join('');
}

function wireDrive(){
  // السحب: المسرح كله بيلف 3D مع سرعة السحب، وبيرجع مكانه بنطّة
  Array.prototype.forEach.call(document.querySelectorAll('.lineblock .stations'), function(el){
    if (el._drive) return; el._drive = 1;
    var last = el.scrollLeft, t = null;
    el.addEventListener('scroll', function(){
      var d = el.scrollLeft - last; last = el.scrollLeft;
      var v = Math.max(-16, Math.min(16, d * 0.7));
      el.style.setProperty('--ry', v.toFixed(1) + 'deg');
      el.classList.add('driving');
      clearTimeout(t);
      t = setTimeout(function(){ el.classList.remove('driving'); el.style.setProperty('--ry', '0deg'); }, 170);
    }, { passive: true });
  });
  // الماوس: المحطة بتميل ناحية المؤشر (3D tilt)
  Array.prototype.forEach.call(document.querySelectorAll('.lineblock .stations .st'), function(st){
    if (st._tilt) return; st._tilt = 1;
    var stage = st.querySelector('.stage3d'); if (!stage) return;
    st.addEventListener('pointermove', function(e){
      if (e.pointerType !== 'mouse') return;
      var r = st.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      st.classList.add('tilt');
      stage.style.setProperty('--sy', (x * 14).toFixed(1) + 'deg'); stage.style.setProperty('--rx', (-y * 8).toFixed(1) + 'deg');
    });
    st.addEventListener('pointerleave', function(){ st.classList.remove('tilt'); stage.style.setProperty('--sy', ''); stage.style.setProperty('--rx', ''); });
  });
}

function fixHwGap(){
  var fr = document.querySelector('.hwframe'); if (!fr) return;
  var gap = 0, blocks = document.querySelectorAll('.lineblock');
  if (blocks.length >= 3){
    var a = blocks[blocks.length - 2].querySelector('.stations'), b = blocks[blocks.length - 1].querySelector('.stations');
    if (a && b) gap = b.getBoundingClientRect().top - a.getBoundingClientRect().bottom;
  }
  if (!(gap > 20)) gap = 60;
  var EXT = 12;   // الإطار الرمادي بيطلع برا الخانات بـ 12px
  var g = document.querySelector('.hwgrid');
  if (g) g.style.setProperty('--hwgap', Math.round(gap + EXT) + 'px');
  // فوق الورشة: نفس مسافة الخطوط بين آخر حاجة قبلها وعنوان الورشة (والعنوان فوق الإطار على طول)
  var box = g ? fr.closest('.lineblock') : fr.closest('.hw-mob');
  if (!box) return;
  box.style.paddingTop = '0px';
  var prev = box.previousElementSibling || (box.parentElement && box.parentElement.previousElementSibling), lbl = box.querySelector('.hwlabel');
  if (prev && lbl && prev.offsetParent !== null){
    var d = lbl.getBoundingClientRect().top - prev.getBoundingClientRect().bottom;
    box.style.paddingTop = Math.max(0, Math.round(Math.max(18, gap * 0.45) - d)) + 'px';   // الورشة أقرب للي فوقها
  }
  // تحت الورشة على الموبايل: لحد محطات الخط 1
  if (!g){
    box.style.marginBottom = '0px';
    var blk = box.closest('.lineblock'), st1 = blk && blk.querySelector('.stations'), ttl = box.nextElementSibling;
    if (ttl && ttl.classList.contains('lines-title')){   // عنوان «لوحة الخطوط» بين الورشة والخط 1
      var d3 = ttl.getBoundingClientRect().top - (fr.getBoundingClientRect().bottom + EXT);
      box.style.marginBottom = Math.max(0, Math.round(gap - d3)) + 'px';
    } else if (st1){ var d2 = st1.getBoundingClientRect().top - (fr.getBoundingClientRect().bottom + EXT); box.style.marginBottom = Math.max(0, Math.round(gap + 30 - d2)) + 'px'; }   // مسافة أكبر شوية بين الورشة والخط 1
  }
}

function shrinkImage(file, max, square, q){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(new Error('ماقدرتش أقرا الصورة.')); };
    fr.onload = function(){
      var im = new Image();
      im.onerror = function(){ rej(new Error('الصورة دي مش مدعومة — جرّب صورة JPG أو PNG.')); };
      im.onload = function(){
        var w = im.naturalWidth, h = im.naturalHeight, sx = 0, sy = 0, sw = w, sh = h, cw, ch;
        if (square){ var m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; cw = ch = max; }
        else { var k = Math.min(1, max / Math.max(w, h)); cw = Math.round(w * k); ch = Math.round(h * k); }
        var c = document.createElement('canvas'); c.width = cw; c.height = ch;
        var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cw, ch); g.drawImage(im, sx, sy, sw, sh, 0, 0, cw, ch);
        res(c.toDataURL('image/jpeg', q || .82));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

      '<div class="row" style="margin-top:12px"><button class="btn primary" id="dbSplit">تقسيم قواعد البيانات</button></div><div id="dbMsg" style="margin-top:10px"></div>';
    else h += '<div class="note" style="margin-top:14px">✓ البيانات متقسمة على الـ 3 ملفات، والموقع بيسجّل كل حاجة في ملفها تلقائي.</div>';
    $('adm').innerHTML = h;
    if ($('dbSplit')) $('dbSplit').onclick = function(){
      var b = this;
      if (b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'متأكد؟ دوس تاني للتقسيم'; b.classList.add('danger'); return; }
      b.disabled = true; b.textContent = 'جاري التقسيم... (ممكن ياخد دقيقة)';
      call('splitDb').then(function(r){
        toast('تم تقسيم قواعد البيانات', 'ok');
        $('dbMsg').innerHTML = '<div class="note">' + r.report.map(esc).join('<br>') + '</div>';
        setTimeout(renderDbPanel, 1800);
      }).catch(function(e){ b.disabled = false; b.textContent = 'تقسيم قواعد البيانات'; $('dbMsg').innerHTML = '<div class="form-msg err">' + esc(e.message) + '</div>'; });
    };
  }).catch(function(e){ $('adm').innerHTML = emptyHTML('مش قادر أجيب معلومات الملفات', e.message); });
}
function renderGrid(g){
  S.grid = g;
  var cols = g.columns;
  function cell(c, v, ri){
    var o = g.options[c.key];
    if (o){
      var has = o.indexOf(v) >= 0;
      return '<select data-r="'+ri+'" data-c="'+c.key+'"><option value=""></option>' + (v && !has ? '<option selected>'+esc(v)+'</option>' : '') +
        o.map(function(x){ return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'; }).join('') + '</select>';
    }
    var t = (c.key === 'code' && g.key === 'users') ? 'text' : (c.numeric ? 'number' : 'text');
    var ltr = (c.key === 'email' || c.key === 'key' || c.key === 'car' || c.key === 'code') ? ' dir="ltr"' : '';
    return '<input type="'+t+'"'+ltr+' data-r="'+ri+'" data-c="'+c.key+'" value="'+esc(v)+'">';
  }
  var h = '<div class="tbl-wrap"><table class="tbl grid-edit"><tr><th>#</th>' + cols.map(function(c){ return '<th>'+esc(c.label)+'</th>'; }).join('') + '<th></th></tr>' +
    g.rows.map(function(r, ri){ return '<tr><td>'+(ri+1)+'</td>' + cols.map(function(c, ci){ return '<td>' + cell(c, r[ci] == null ? '' : String(r[ci]), ri) + '</td>'; }).join('') +
      '<td><button class="btn sm danger" data-delrow="'+ri+'" title="حذف الصف">✕</button></td></tr>'; }).join('') + '</table></div>' +
    '<div class="row" style="margin-top:12px"><button class="btn" id="gAdd">+ صف جديد</button><span class="sp"></span><button class="btn primary" id="gSave">حفظ التغييرات</button></div>' +
    '<div id="gMsg" style="margin-top:10px"></div>';
  $('adm').innerHTML = h;
  function collect(){
    var rows = g.rows.map(function(r){ return r.slice(); });
    Array.prototype.forEach.call(document.querySelectorAll('#adm [data-r]'), function(el){
      var ri = +el.dataset.r, ci = cols.map(function(c){ return c.key; }).indexOf(el.dataset.c);
      rows[ri][ci] = el.value;
    });
    return rows;
  }
  $('gAdd').onclick = function(){ g.rows = collect(); g.rows.push(cols.map(function(){ return ''; })); renderGrid(g); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-delrow]'), function(b){
    b.onclick = function(){ g.rows = collect(); g.rows.splice(+b.dataset.delrow, 1); renderGrid(g); toast('اتشال الصف — دوس «حفظ التغييرات» علشان يتحفظ'); };
  });
  $('gSave').onclick = function(){
    var rows = collect();
    this.disabled = true; this.textContent = 'جاري الحفظ...';
    call('adminSave', { key: g.key, rows: rows }).then(function(ng){
      toast('تم حفظ «' + ng.name + '»', 'ok'); renderGrid(ng); return refreshBoot();
    }).then(function(){ buildNav(); document.querySelectorAll('[data-go]').forEach(function(a){ a.classList.toggle('on', a.dataset.go === 'settings'); }); })
      .catch(function(e){ $('gSave').disabled = false; $('gSave').textContent = 'حفظ التغييرات'; $('gMsg').innerHTML = '<div class="form-msg err">'+esc(e.message)+'</div>'; });
  };
}

/* ---------- الحركة: دخول العناصر بالتتابع + عدّاد الأرقام ---------- */
(function(){
  var reduce = false; try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}
  if (reduce || !window.MutationObserver) return;
  var SEL = '.qt,.kpi,.card,.item,.st,.hwcell,.sec-title,.linehead,.hwlabel,.slotrow';
  function countUp(el){
    if (el.dataset.cu) return; el.dataset.cu = 1;
    var txt = el.textContent.trim(), m = txt.match(/^(\d+(?:\.\d+)?)(.*)$/);
    if (!m) return;
    var end = parseFloat(m[1]), suf = m[2], dec = (m[1].split('.')[1] || '').length, t0 = null, dur = 750;
    if (!(end > 0)) return;
    function step(ts){
      if (t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = (end * e).toFixed(dec) + suf;
      if (k < 1) requestAnimationFrame(step); else el.textContent = txt;
    }
    requestAnimationFrame(step);
  }
  function animate(root){
    var list = [];
    if (root.matches && root.matches(SEL)) list.push(root);
    if (root.querySelectorAll) list = list.concat(Array.prototype.slice.call(root.querySelectorAll(SEL)));
    var perParent = new Map();
    list.forEach(function(el){
      if (el.classList.contains('mo')) return;
      var p = el.parentNode, n = perParent.get(p) || 0; perParent.set(p, n + 1);
      el.style.animationDelay = Math.min(n * 45, 420) + 'ms';
      el.classList.add('mo');
    });
    if (root.querySelectorAll) Array.prototype.forEach.call(root.querySelectorAll('.kpi .val'), countUp);
  }
  var obs = new MutationObserver(function(muts){
    muts.forEach(function(m){ Array.prototype.forEach.call(m.addedNodes, function(n){ if (n.nodeType === 1) animate(n); }); });
  });
  function start(){ ['view','modalRoot'].forEach(function(id){ var el = document.getElementById(id); if (el) obs.observe(el, { childList: true, subtree: true }); }); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
<script>
/* تطبيق الموبايل: لو رابط السيرفر مش متحط في config.js */
if (!window.NERIC_API || /PASTE/.test(window.NERIC_API)) {
  window.NERIC_API = '';
  document.addEventListener('DOMContentLoaded', function(){ var e = document.getElementById('lgErr'); if (e){ e.textContent = 'التطبيق لسه مش متوصل بالسيرفر — المسؤول لازم يحط رابط تطبيق الويب في ملف config.js'; e.classList.remove('hidden'); } });
}
/* لون شريط الموبايل اللي فوق (الساعة والإشعارات): أزرق في الوضع العادي وغامق في الليلي — علشان الأيقونات البيضا تبان */
(function(){
  function sync(){
    var t = document.documentElement.getAttribute('data-theme');
    var dark = t ? t === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    var c = dark ? '#0b1220' : '#0a5cff';
    var old = document.querySelectorAll('meta[name=theme-color]');
    if (old.length === 1 && old[0].getAttribute('content') === c && sync.done) return;
    // بنشيل القديم ونحط meta جديد — كروم على الموبايل بيحدّث لون الشريط لما الـ meta يتضاف من جديد
    Array.prototype.forEach.call(old, function(m){ m.parentNode.removeChild(m); });
    var m = document.createElement('meta'); m.name = 'theme-color'; m.content = c; document.head.appendChild(m);
    sync.done = 1;
  }
  sync();
  window.addEventListener('load', function(){ sync.done = 0; sync(); setTimeout(function(){ sync.done = 0; sync(); }, 600); });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden){ sync.done = 0; sync(); } });
  new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (window.matchMedia) try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', sync); } catch(e){}
})();
/* التثبيت والعمل من غير نت: الـ Service Worker بيحفظ شكل التطبيق، والبيانات دايمًا من السيرفر */
if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js?v=202610290823').catch(function(){}); });
</script>
